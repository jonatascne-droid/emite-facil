  const [carregandoComprovante, setCarregandoComprovante] = useState(false);
  const [excluindo, setExcluindo] = useState(false);
  const [carregandoNota, setCarregandoNota] = useState(false);
  const [cancelandoNota, setCancelandoNota] = useState(false);
  const info = getStatusInfo(pais)[pedido.status] || { cor: "border-slate-200 bg-slate-50 text-slate-600", rotulo: pedido.status };
  const aguardandoConfirmacaoOmie = pedido.notas_fiscais?.status === "aguardando_confirmacao";
  const infoEfetiva = aguardandoConfirmacaoOmie
    ? { cor: "border-purple-200 bg-purple-50 text-purple-700", rotulo: t("pd_status_aguardando_confirmacao", pais) }
    : info;
  const respostas = pedido.respostas || {};
  const nome = pedido.produtos_servicos?.nome || pedido.nome_item || "";
  const preco = pedido.produtos_servicos?.preco ?? pedido.valor;

  const podeEmitir = pedido.status === "processando" || pedido.status === "falha_emissao";
  const jaEmitida = pedido.status === "emitido" || pedido.status === "confirmado_manual";
  // "Pagamento em aberto" agora é independente do status: mesmo que a nota já tenha sido
  // emitida antecipadamente (cliente que exige NF antes de pagar), o pagamento pode continuar pendente.
  const pagamentoNaoConfirmado = !pedido.pagamento_confirmado && pedido.status !== "cancelado";
  const podeEmitirSemRecebimento = pagamentoNaoConfirmado && !jaEmitida;

  async function emitir(confirmarReemissao) {
    setEmitindo(true);
    try {
      const { data: sessionData } = await sb.auth.getSession();
      const resp = await fetch("https://anbvaoegvvjqcfhurpet.supabase.co/functions/v1/emitir-pedido-manual", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + sessionData.session.access_token },
        body: JSON.stringify({ pedido_id: pedido.id, confirmar_reemissao: !!confirmarReemissao }),
      });
      const data = await resp.json();
      if (resp.status === 409 && data.precisa_confirmacao) {
        const confirmou = window.confirm(t("pd_reemissao_confirmar", pais));
        if (confirmou) { setEmitindo(false); return emitir(true); }
        setEmitindo(false);
        return;
      }
      if (!resp.ok || data.status === "falha_emissao") throw new Error(data.erro || data.error || t("pd_erro_emitir", pais));
      toast.success(t("pd_emitido_sucesso", pais));
      onAtualizado && onAtualizado();
    } catch (err) {
      toast.error(err instanceof Error ? err.message : t("pd_erro_emitir", pais));
      onAtualizado && onAtualizado();
    } finally {
      setEmitindo(false);
    }
  }

  async function confirmarPagamento() {
    setConfirmando(true);
    try {
      const { data: sessionData } = await sb.auth.getSession();
      const resp = await fetch("https://anbvaoegvvjqcfhurpet.supabase.co/functions/v1/confirmar-pagamento-manual", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + sessionData.session.access_token },
        body: JSON.stringify({ pedido_id: pedido.id }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || t("pd_erro_confirmar", pais));
      toast.success(t("pd_pagamento_confirmado_sucesso", pais));
      onAtualizado && onAtualizado();
    } catch (err) {
      toast.error(err instanceof Error ? err.message : t("pd_erro_confirmar", pais));
    } finally {
      setConfirmando(false);
    }
  }

  async function verComprovante() {
    setCarregandoComprovante(true);
    try {
      const { data: sessionData } = await sb.auth.getSession();
      const resp = await fetch("https://anbvaoegvvjqcfhurpet.supabase.co/functions/v1/obter-comprovante-url", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + sessionData.session.access_token },
        body: JSON.stringify({ pedido_id: pedido.id }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || t("pd_erro_comprovante", pais));
      window.open(data.url, "_blank");
    } catch (err) {
      toast.error(err instanceof Error ? err.message : t("pd_erro_comprovante", pais));
    } finally {
      setCarregandoComprovante(false);
    }
  }

  async function visualizarNota() {
    setCarregandoNota(true);
    try {
      const { data: sessionData } = await sb.auth.getSession();
      const resp = await fetch("https://anbvaoegvvjqcfhurpet.supabase.co/functions/v1/gerenciar-nota-fiscal", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + sessionData.session.access_token },
        body: JSON.stringify({ pedido_id: pedido.id, acao: "visualizar" }),
      });
      const data = await resp.json();
      if (!resp.ok || !data.url) throw new Error(data.error || t("pd_erro_ver_nota", pais));
      window.open(data.url, "_blank");
    } catch (err) {
      toast.error(err instanceof Error ? err.message : t("pd_erro_ver_nota", pais));
    } finally {
      setCarregandoNota(false);
    }
  }

  async function cancelarNota() {
    const motivo = window.prompt(t("pd_motivo_cancelamento_prompt", pais)) || "";
    if (motivo.trim().length < 15) {
      if (motivo.trim().length > 0) toast.error(t("pd_motivo_cancelamento_curto", pais));
      return;
    }
    if (!window.confirm(t("pd_confirmar_cancelamento_nota", pais))) return;
    setCancelandoNota(true);
    try {
      const { data: sessionData } = await sb.auth.getSession();
      const resp = await fetch("https://anbvaoegvvjqcfhurpet.supabase.co/functions/v1/gerenciar-nota-fiscal", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + sessionData.session.access_token },
        body: JSON.stringify({ pedido_id: pedido.id, acao: "cancelar", motivo: motivo.trim() }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || t("pd_erro_cancelar_nota", pais));
      toast.success(t("pd_nota_cancelada_sucesso", pais));
      onAtualizado && onAtualizado();
    } catch (err) {
      toast.error(err instanceof Error ? err.message : t("pd_erro_cancelar_nota", pais));
    } finally {
      setCancelandoNota(false);
    }
  }

  async function moverParaLixeira() {
    if (!window.confirm(t("pd_confirmar_lixeira", pais))) return;
    setExcluindo(true);
    try {
      const { error } = await sb.from("pedidos").update({ excluido_em: new Date().toISOString() }).eq("id", pedido.id);
      if (error) throw new Error(error.message);
      toast.success(t("pd_movido_lixeira", pais));
      onAtualizado && onAtualizado();
    } catch (err) {
      toast.error(err instanceof Error ? err.message : t("pd_erro_lixeira", pais));
    } finally {
      setExcluindo(false);
    }
  }

  async function restaurar() {
    setExcluindo(true);
    try {
      const { error } = await sb.from("pedidos").update({ excluido_em: null }).eq("id", pedido.id);
      if (error) throw new Error(error.message);
      toast.success(t("pd_restaurado", pais));
      onAtualizado && onAtualizado();
    } catch (err) {
      toast.error(err instanceof Error ? err.message : t("pd_erro_lixeira", pais));
    } finally {
      setExcluindo(false);
    }
  }

  async function excluirDefinitivamente() {
    if (!window.confirm(t("pd_confirmar_exclusao_definitiva", pais))) return;
    setExcluindo(true);
    try {
      const { data: sessionData } = await sb.auth.getSession();
      const resp = await fetch("https://anbvaoegvvjqcfhurpet.supabase.co/functions/v1/excluir-pedido-permanente", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + sessionData.session.access_token },
        body: JSON.stringify({ pedido_id: pedido.id }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || t("pd_erro_lixeira", pais));
      toast.success(t("pd_excluido_definitivo", pais));
      onAtualizado && onAtualizado();
    } catch (err) {
      toast.error(err instanceof Error ? err.message : t("pd_erro_lixeira", pais));
    } finally {
      setExcluindo(false);
    }
  }

  return (
    <Card className={"overflow-hidden border-l-4 " + infoEfetiva.cor.split(" ")[0]}>
      <button onClick={() => setAberto((v) => !v)} className="w-full text-left p-4 flex items-center justify-between gap-3">
        <div className="min-w-0">
          <p className="text-sm font-medium truncate">{nome}{pedido.cliente_nome ? " · " + pedido.cliente_nome : ""}</p>
          <div className="flex items-center gap-2 mt-0.5">
            <p className="text-slate-400 text-xs">{new Date(pedido.criado_em).toLocaleString()}</p>
            {pedido.origem && pedido.origem !== "checkout" && (
              <span className="text-[10px] uppercase tracking-wide font-semibold text-slate-400 bg-slate-100 rounded px-1.5 py-0.5">via {pedido.origem.replace("_", " ")}</span>
            )}
          </div>
        </div>
        <div className="flex items-center gap-2 shrink-0">
          {preco != null && (
            <span className="font-display text-sm font-semibold">{formatarMoeda(preco, pais)}</span>
          )}
          <span className={"rounded-full px-2.5 py-0.5 text-xs font-medium border " + (pedido.status === "aguardando_pagamento" ? "border-amber-200 bg-amber-50 text-amber-700" : infoEfetiva.cor)}>
            {pedido.status === "aguardando_pagamento" ? t("pd_pagamento_aberto", pais) : infoEfetiva.rotulo}
          </span>
          {pagamentoNaoConfirmado && pedido.status !== "aguardando_pagamento" && (
            <span className="rounded-full border border-amber-200 bg-amber-50 px-2.5 py-0.5 text-xs font-medium text-amber-700">
              {t("pd_pagamento_aberto", pais)}
            </span>
          )}
          {aberto ? <Icon.ChevronUp className="h-4 w-4 text-slate-400" /> : <Icon.ChevronDown className="h-4 w-4 text-slate-400" />}
        </div>
      </button>

      {aberto && (
        <div className="border-t border-slate-100 px-4 py-4 bg-slate-50/50">
          {Array.isArray(pedido.pedido_itens) && pedido.pedido_itens.length > 1 && (
            <div className="mb-3 space-y-1.5 rounded-lg border border-slate-200 bg-white p-3">
              {pedido.pedido_itens.map((item, i) => (
                <div key={i} className="flex items-center justify-between text-sm">
                  <span>{item.nome_produto} <span className="text-slate-400">x{item.quantidade}</span></span>
                  <span className="text-slate-600 font-medium">{formatarMoeda(item.subtotal ?? (item.preco_unitario || 0) * item.quantidade, pais)}</span>
                </div>
              ))}
              <div className="flex items-center justify-between border-t border-slate-100 pt-1.5 text-sm font-semibold">
                <span>{t("pub_total", pais)}</span>
                <span>{formatarMoeda(preco, pais)}</span>
              </div>
            </div>
          )}
          <div className="grid gap-2 sm:grid-cols-2">
            {Object.entries(respostas).map(([chave, valor]) => (
              <div key={chave}>
                <p className="text-slate-400 text-xs">{chave}</p>
                <p className="text-sm">{String(valor) || "—"}</p>
              </div>
            ))}
          </div>
          <div className="mt-3 pt-3 border-t border-slate-200 flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-slate-500">
            <span>{t("pd_pagamento", pais)}: {pedido.forma_pagamento ? rotuloFormaPagamento(pedido.forma_pagamento, pais) : "—"}</span>
            {pedido.codigo_recebimento && <span>{t("pd_codigo", pais)}: {pedido.codigo_recebimento}</span>}
            {pedido.notas_fiscais?.numero_nota && <span>{t("pd_nota_num", pais)} {pedido.notas_fiscais.numero_nota}</span>}
          </div>
          {pedido.notas_fiscais?.status === "aguardando_confirmacao" && (
            <p className="border-purple-200 bg-purple-50 text-purple-700 mt-2 flex items-center gap-1.5 rounded-lg border px-3 py-2 text-xs">
              <Icon.Spinner className="h-3 w-3 shrink-0" />{t("pd_aguardando_confirmacao_omie", pais)}
            </p>
          )}
          {pedido.comprovante_path && (
            <button onClick={verComprovante} disabled={carregandoComprovante}
              className="text-primary-600 hover:underline text-xs font-medium mt-2 flex items-center gap-1.5 disabled:opacity-60">
              {carregandoComprovante ? <Icon.Spinner className="h-3 w-3" /> : <Icon.Link className="h-3 w-3" />}{t("pd_ver_comprovante", pais)}
            </button>
          )}
          {pedido.notas_fiscais?.url_pdf && (
            <a href={pedido.notas_fiscais.url_pdf} target="_blank" rel="noopener noreferrer" className="text-primary-600 hover:underline text-xs font-medium mt-2 inline-block">
              {t("pd_ver_pdf", pais)} ↗
            </a>
          )}
          {pedido.notas_fiscais?.mensagem_erro && (
            <p className="text-red-600 text-xs mt-2">{t("pd_erro", pais)} {pedido.notas_fiscais.mensagem_erro}</p>
          )}
          {pedido.notas_fiscais?.status === "sucesso" && pedido.notas_fiscais?.provedores_fiscais?.slug === "omie" && (
            <p className="text-slate-400 mt-2 text-xs">{t("pd_cancelar_nota_aviso_omie", pais)}</p>
          )}
          {pedido.notas_fiscais?.status === "sucesso" && pedido.notas_fiscais?.provedores_fiscais?.slug === "notaas" && (
            <div className="mt-2 flex flex-wrap gap-x-4 gap-y-1">
              {!pedido.notas_fiscais?.url_pdf && (
                <button onClick={visualizarNota} disabled={carregandoNota}
                  className="text-primary-600 hover:underline text-xs font-medium flex items-center gap-1.5 disabled:opacity-60">
                  {carregandoNota ? <Icon.Spinner className="h-3 w-3" /> : <Icon.Link className="h-3 w-3" />}{t("pd_visualizar_nota", pais)}
                </button>
              )}
              <button onClick={cancelarNota} disabled={cancelandoNota}
                className="text-red-600 hover:underline text-xs font-medium flex items-center gap-1.5 disabled:opacity-60">
                {cancelandoNota ? <Icon.Spinner className="h-3 w-3" /> : <Icon.Trash className="h-3 w-3" />}{t("pd_cancelar_nota", pais)}
              </button>
            </div>
          )}

          <div className="mt-3 pt-3 border-t border-slate-200 flex flex-wrap gap-2">
            {naLixeira ? (
              <React.Fragment>
                <Button variant="outline" onClick={restaurar} loading={excluindo}><Icon.ArrowLeft className="h-4 w-4" />{t("pd_restaurar", pais)}</Button>
                <Button variant="ghost" onClick={excluirDefinitivamente} loading={excluindo} className="text-red-600 hover:bg-red-50">
                  <Icon.Trash className="h-4 w-4" />{t("pd_excluir_definitivo", pais)}
                </Button>
              </React.Fragment>
            ) : (
              <React.Fragment>
                {pagamentoNaoConfirmado && <Button onClick={confirmarPagamento} loading={confirmando}><Icon.Check className="h-4 w-4" />{t("pd_confirmar_pagamento", pais)}</Button>}
                {podeEmitirSemRecebimento && <Button variant="outline" onClick={() => emitir(false)} loading={emitindo}>{t("pd_emitir_sem_recebimento", pais)}</Button>}
                {podeEmitir && <Button onClick={() => emitir(false)} loading={emitindo}>{t("pd_emitir", pais)}</Button>}
                {jaEmitida && <Button variant="ghost" onClick={() => emitir(false)} loading={emitindo}>{t("pd_emitir_novamente", pais)}</Button>}
                <Button variant="ghost" onClick={moverParaLixeira} loading={excluindo} className="text-slate-400 hover:text-red-600 ml-auto">
                  <Icon.Trash className="h-4 w-4" />
                </Button>
              </React.Fragment>
            )}
          </div>
        </div>
      )}
    </Card>
  );
}

function PedidosPage({ empresa }) {
  const toast = useToast();
  const pais = empresa?.pais;
  const [carregando, setCarregando] = useState(true);
  const [pedidos, setPedidos] = useState([]);
  const [filtro, setFiltro] = useState("todos");
  const [emitindoTodas, setEmitindoTodas] = useState(false);

  const carregar = useCallback(() => {
    if (!empresa?.id) { setCarregando(false); return; }
    setCarregando(true);
    return sb.from("pedidos").select("*, produtos_servicos(nome, preco, tipo_operacao), notas_fiscais(status, numero_nota, url_pdf, mensagem_erro, notaas_invoice_id, provedores_fiscais(slug)), pedido_itens(nome_produto, preco_unitario, quantidade, subtotal)")
      .eq("empresa_id", empresa.id).order("criado_em", { ascending: false }).limit(100)
      .then(({ data, error }) => {
        if (error) { toast.error(error.message); setPedidos([]); setCarregando(false); return; }
        setPedidos(data || []);
        setCarregando(false);
      });
  }, [empresa]);

  useEffect(() => { carregar(); }, [carregar]);

  // Atualiza sozinho quando chega pedido novo ou quando o status de algum muda
  // (evita a aba ficar "desatualizada" se já estava aberta antes do pedido chegar)
  useEffect(() => {
    if (!empresa?.id) return;
    const channel = sb.channel("pedidos-" + empresa.id)
      .on("postgres_changes", { event: "*", schema: "public", table: "pedidos", filter: "empresa_id=eq." + empresa.id }, () => {
        carregar();
      })
      .subscribe();
    return () => { sb.removeChannel(channel); };
  }, [empresa, carregar]);

  const pendentesCount = pedidos.filter((p) => p.status === "processando" && !p.excluido_em).length;

  async function emitirTodas() {
    setEmitindoTodas(true);
    try {
      const { data: sessionData } = await sb.auth.getSession();
      const resp = await fetch("https://anbvaoegvvjqcfhurpet.supabase.co/functions/v1/emitir-pedidos-pendentes", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + sessionData.session.access_token },
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || t("pd_erro_emitir", pais));
      toast.success(data.emitidos + " / " + data.total + (data.falhas > 0 ? " (" + data.falhas + " " + t("pd_status_falha", pais).toLowerCase() + ")" : ""));
      carregar();
    } catch (err) {
      toast.error(err instanceof Error ? err.message : t("pd_erro_emitir", pais));
    } finally {
      setEmitindoTodas(false);
    }
  }

  const filtros = [
    { key: "todos", rotulo: t("pd_todos", pais) },
    { key: "falha_emissao", rotulo: t("pd_precisam_atencao", pais) },
    { key: "emitido", rotulo: t("pd_emitidos", pais) },
    { key: "aguardando_pagamento", rotulo: t("pd_aguardando_pagamento", pais) },
    { key: "cancelado", rotulo: t("pd_cancelados", pais) },
    { key: "lixeira", rotulo: t("pd_lixeira", pais) },
  ];

  const naoExcluidos = pedidos.filter((p) => !p.excluido_em);
  const pedidosFiltrados = filtro === "lixeira" ? pedidos.filter((p) => p.excluido_em)
    : filtro === "todos" ? naoExcluidos
    : naoExcluidos.filter((p) => p.status === filtro);

  return (
    <div className="mx-auto max-w-3xl">
      <div className="flex flex-wrap items-start justify-between gap-4">
        <div>
          <h1 className="font-display text-2xl font-semibold">{t("pd_titulo", pais)}</h1>
          <p className="text-slate-500 mt-1 text-sm">{t("pd_subtitulo", pais)}</p>
        </div>
        {pendentesCount > 0 && (
          <Button onClick={emitirTodas} loading={emitindoTodas}>{t("pd_emitir_todas", pais)} ({pendentesCount})</Button>
        )}
      </div>

      <div className="mt-4 flex flex-wrap gap-1 rounded-lg bg-slate-100 p-1 text-xs font-medium w-fit">
        {filtros.map((f) => (
          <button key={f.key} onClick={() => setFiltro(f.key)}
            className={"rounded-md px-3 py-1.5 transition-colors flex items-center gap-1.5 " + (filtro === f.key ? "bg-white shadow-sm text-slate-900" : "text-slate-500")}>
            {f.key === "lixeira" && <Icon.Trash className="h-3.5 w-3.5" />}{f.rotulo}
          </button>
        ))}
      </div>

      {carregando ? (
        <div className="text-slate-500 mt-10 flex items-center gap-2 text-sm"><Icon.Spinner className="h-4 w-4" />{t("carregando", pais)}</div>
      ) : pedidosFiltrados.length === 0 ? (
        <Card className="p-8 mt-6 text-center">
          <p className="text-slate-500 text-sm">{filtro === "lixeira" ? t("pd_lixeira_vazia", pais) : t("pd_vazio", pais)}</p>
        </Card>
      ) : (
        <div className="mt-6 space-y-2">
          {pedidosFiltrados.map((p) => <CardPedido key={p.id} pedido={p} onAtualizado={carregar} pais={pais} naLixeira={filtro === "lixeira"} />)}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   NOTIFICAÇÕES
============================================================ */
function NotificacoesPage({ empresa }) {
  const pais = empresa?.pais;
  const [carregando, setCarregando] = useState(true);
  const [notificacoes, setNotificacoes] = useState([]);

  const carregar = useCallback(async () => {
    if (!empresa?.id) { setCarregando(false); return; }
    setCarregando(true);
    const { data } = await sb.from("notificacoes").select("*").eq("empresa_id", empresa.id).order("criado_em", { ascending: false }).limit(50);
    setNotificacoes(data || []);
    setCarregando(false);
  }, [empresa]);

  useEffect(() => { carregar(); }, [carregar]);

  async function marcarLida(id) {
    setNotificacoes((n) => n.map((x) => (x.id === id ? { ...x, lida: true } : x)));
    await sb.from("notificacoes").update({ lida: true }).eq("id", id);
  }

  const naoLidas = notificacoes.filter((n) => !n.lida);
  const lidas = notificacoes.filter((n) => n.lida);

  const corPorTipo = (tipo) => {
    if (tipo === "falha_emissao" || tipo === "erro_validacao") return "border-red-200 bg-red-50 text-red-700";
    return "border-primary-200 bg-primary-50 text-primary-700";
  };

  const iconePorTipo = (tipo) => {
    if (tipo === "falha_emissao" || tipo === "erro_validacao") return "⚠️";
    return "✓";
  };

  function CardNotificacao({ n }) {
    return (
      <button onClick={() => !n.lida && marcarLida(n.id)}
        className={"w-full text-left rounded-lg border px-4 py-3 flex items-start gap-3 transition-opacity " +

  return url;

function QuantidadeInput({ valor, onCommit }) {
  const [texto, setTexto] = useState(String(valor));
  useEffect(() => { setTexto(String(valor)); }, [valor]);

  function commitar() {
    const numero = Math.max(1, Math.min(999, Math.round(Number(texto) || 1)));
    setTexto(String(numero));
    onCommit(numero);
  }

  return (
    <input type="number" min="1" max="999" inputMode="numeric" value={texto}
      onChange={(e) => setTexto(e.target.value)}
      onBlur={commitar}
      onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); commitar(); e.target.blur(); } }}
      onFocus={(e) => e.target.select()}
      className="w-12 rounded-md border border-slate-300 py-1 text-center text-sm font-medium focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500" />
  );
}

function UploadComprovantePix({ pedidoId, pais }) {
  const toast = useToast();
  const [enviando, setEnviando] = useState(false);
  const [enviado, setEnviado] = useState(false);

  async function handleFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    if (file.size > 8 * 1024 * 1024) { toast.error(t("pub_comprovante_muito_grande", pais)); return; }
    setEnviando(true);
    try {
      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(",")[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      const resp = await fetch("https://anbvaoegvvjqcfhurpet.supabase.co/functions/v1/enviar-comprovante-pix", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + SUPABASE_ANON_KEY },
        body: JSON.stringify({ pedido_id: pedidoId, arquivo_base64: base64, tipo_mime: file.type }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || t("pub_erro_enviar", pais));
      setEnviado(true);
      toast.success(t("pub_comprovante_enviado", pais));
    } catch (err) {
      toast.error(err instanceof Error ? err.message : t("pub_erro_enviar", pais));
    } finally {
      setEnviando(false);
    }
  }

  if (enviado) {
    return (
      <div className="bg-primary-50 border-primary-200 mt-5 flex items-center gap-2 rounded-lg border px-4 py-3 text-left">
        <Icon.Check className="text-primary-600 h-4 w-4 shrink-0" />
        <p className="text-primary-700 text-sm">{t("pub_comprovante_enviado", pais)}</p>
      </div>
    );
  }

  return (
    <div className="bg-slate-50 mt-5 rounded-lg px-4 py-3 text-left">
      <p className="text-slate-600 mb-2 text-xs font-semibold">{t("pub_envie_comprovante", pais)}</p>
      <label className="border-slate-300 hover:border-primary-300 flex cursor-pointer items-center justify-center gap-2 rounded-lg border border-dashed px-3 py-3 text-sm text-slate-500">
        {enviando ? <Icon.Spinner className="h-4 w-4" /> : <Icon.ImagePlus className="h-4 w-4" />}
        {enviando ? t("pub_enviando", pais) : t("pub_escolher_arquivo", pais)}
        <input type="file" accept="image/png,image/jpeg,image/webp,application/pdf" className="hidden" onChange={handleFile} disabled={enviando} />
      </label>
    </div>
  );
}

function ProdutoPublico({ slug }) {
  const toast = useToast();
  const [carregando, setCarregando] = useState(true);
  const [produto, setProduto] = useState(null);
  const [empresa, setEmpresa] = useState(null);
  const [outrosProdutos, setOutrosProdutos] = useState([]);
  const [aceitaCartao, setAceitaCartao] = useState(false);

  const [carrinho, setCarrinho] = useState([]); // [{ produto: {id,nome,preco,slug_checkout}, campos: [...], quantidade }]
  const [mostrarSeletorProduto, setMostrarSeletorProduto] = useState(false);

  const [etapa, setEtapa] = useState("visualizando"); // visualizando | formulario | enviando | aguardando | emitido | falha
  const [respostas, setRespostas] = useState({});
  const [formaPagamento, setFormaPagamento] = useState(null);
  const [pedidoAtual, setPedidoAtual] = useState(null);
  const [codigoGerado, setCodigoGerado] = useState(null);

  const pais = empresa?.pais || "BR";

  useEffect(() => {
    async function carregar() {
      try {
        const resp = await fetch("https://anbvaoegvvjqcfhurpet.supabase.co/functions/v1/buscar-produto-publico", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ slug_checkout: slug }),
        });
        const data = await resp.json();
        if (resp.ok) {
          setProduto(data.produto);
          setEmpresa(data.empresa || null);
          setOutrosProdutos(data.outros_produtos || []);
          setAceitaCartao(!!data.aceita_cartao);
          setCarrinho([{ produto: data.produto, campos: data.campos || [], quantidade: 1 }]);
        }
      } finally {
        setCarregando(false);
      }
    }
    carregar();
  }, [slug]);

  // Escuta em tempo real o status do pedido depois de criado
  useEffect(() => {
    if (!pedidoAtual) return;
    const channel = sb.channel("pedido-" + pedidoAtual)
      .on("postgres_changes", { event: "UPDATE", schema: "public", table: "pedidos", filter: "id=eq." + pedidoAtual }, (payload) => {
        const novoStatus = payload.new.status;
        if (novoStatus === "emitido" || novoStatus === "confirmado_manual") setEtapa("emitido");
        else if (novoStatus === "falha_emissao") setEtapa("falha");
        else if (novoStatus === "erro_validacao") setEtapa("falha");
      })
      .subscribe();
    return () => { sb.removeChannel(channel); };
  }, [pedidoAtual]);

  function atualizarResposta(campo, valor) {
    setRespostas((r) => ({ ...r, [campo.rotulo]: valor }));
  }

  function alterarQuantidade(produtoId, delta) {
    setCarrinho((c) => c.map((item) => item.produto.id === produtoId
      ? { ...item, quantidade: Math.max(1, Math.min(999, item.quantidade + delta)) }
      : item));
  }

  function definirQuantidade(produtoId, valor) {
    const numero = Math.max(1, Math.min(999, Math.round(Number(valor) || 1)));
    setCarrinho((c) => c.map((item) => item.produto.id === produtoId ? { ...item, quantidade: numero } : item));
  }

  function adicionarAoCarrinho(produtoOutro) {
    setCarrinho((c) => {
      if (c.some((item) => item.produto.id === produtoOutro.id)) return c;
      return [...c, { produto: produtoOutro, campos: produtoOutro.campos || [], quantidade: 1 }];
    });
    setMostrarSeletorProduto(false);
    toast.success(t("pub_item_adicionado", pais));
  }

  function removerDoCarrinho(produtoId) {
    setCarrinho((c) => c.length > 1 ? c.filter((item) => item.produto.id !== produtoId) : c);
  }

  // União dos campos de todos os produtos do carrinho, sem repetir por rótulo,
  // mas guardando de quais produtos cada campo vem (pra referenciar quando não for comum a todos).
  const camposForm = React.useMemo(() => {
    const mapa = new Map();
    for (const item of carrinho) {
      for (const c of item.campos) {
        const chave = c.rotulo.trim().toLowerCase();
        const atual = mapa.get(chave);
        const produtosRef = atual ? [...atual.produtosRef, item.produto] : [item.produto];
        mapa.set(chave, atual
          ? { ...atual, obrigatorio: atual.obrigatorio || c.obrigatorio, produtosRef }
          : { ...c, id: chave, produtosRef });
      }
    }
    return [...mapa.values()];
  }, [carrinho]);

  const valorTotal = carrinho.reduce((soma, item) => soma + (Number(item.produto.preco) || 0) * item.quantidade, 0);
  const totalItens = carrinho.reduce((soma, item) => soma + item.quantidade, 0);

  async function enviarPedido(e) {
    e.preventDefault();
    if (!formaPagamento) { toast.error(t("pub_escolha_pagamento", pais)); return; }
    setEtapa("enviando");
    try {
      const resp = await fetch("https://anbvaoegvvjqcfhurpet.supabase.co/functions/v1/criar-pedido", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + SUPABASE_ANON_KEY },
        body: JSON.stringify({
          itens: carrinho.map((item) => ({ produto_id: item.produto.id, quantidade: item.quantidade })),
          respostas,
          forma_pagamento: formaPagamento,
        }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || t("pub_erro_enviar", pais));

      if (data.campos_faltando && data.campos_faltando.length > 0) {
        toast.error(data.campos_faltando.join(", "));
        setEtapa("formulario");
        return;
      }

      setPedidoAtual(data.pedido_id);
      setCodigoGerado(data.codigo_recebimento || null);

      if (formaPagamento === "cartao" && data.checkout_url) {
        window.location.href = data.checkout_url;
        return;
      }

      setEtapa("aguardando");
    } catch (err) {
      toast.error(err instanceof Error ? err.message : t("pub_erro_enviar", pais));
      setEtapa("formulario");
    }
  }

  if (carregando) {
    return <div className="min-h-screen flex items-center justify-center"><Icon.Spinner className="h-6 w-6 text-primary-600" /></div>;
  }

  if (!produto) {
    return (
      <div className="bg-surface-gradient min-h-screen flex items-center justify-center px-5">
        <Card className="p-8 max-w-sm text-center">
          <p className="font-display text-lg font-semibold">{t("pub_produto_nao_encontrado", "BR")}</p>
          <p className="text-slate-500 text-sm mt-1">{t("pub_link_expirado", "BR")}</p>
        </Card>
      </div>
    );
  }

  const chavePagamentoInstantaneo = pais === "ES" ? empresa?.iban : empresa?.pix_chave;
  const tema = empresa?.tema_loja || "padrao";
  const temHero = !!TEMAS_LOJA[tema]?.hero;
  const mostrarHero = temHero && !!empresa;
  const disponiveisPraAdicionar = outrosProdutos.filter((p) => !carrinho.some((item) => item.produto.id === p.id));

  return (
    <div className={(mostrarHero ? "" : "bg-surface-gradient ") + "min-h-screen pb-10"}>
      {mostrarHero && etapa !== "visualizando" && <FundoHeroLoja tema={tema} />}
      {empresa && etapa === "visualizando" && (
        <CabecalhoLoja empresa={empresa} largura="max-w-xl"
          voltarHref={"#loja/" + empresa.slug_loja}
          voltarTexto={t("pub_ver_todos", pais) + " " + empresa.nome_empresa} />
      )}
      <div className={"mx-auto max-w-xl px-5" + (empresa && etapa === "visualizando" ? "" : " pt-10")}>

        {etapa === "visualizando" && (
          <React.Fragment>
            <Card className="anim-surgir p-6" style={{ animationDelay: "60ms" }}>
              {carrinho.length === 1 ? (
                <React.Fragment>
                  <p className="font-display text-2xl font-semibold">{produto.nome}</p>
                  {produto.descricao && <p className="text-slate-600 text-sm mt-2">{produto.descricao}</p>}
                  {produto.preco != null && (
                    <p className="font-display text-3xl font-semibold mt-4 text-primary-700">
                      {formatarMoeda(produto.preco, pais)}
                    </p>
                  )}
                </React.Fragment>
              ) : (
                <React.Fragment>
                  <p className="text-slate-500 text-sm font-medium">{t("pub_valor_total_pedido", pais)}</p>
                  <p className="font-display text-3xl font-semibold mt-1 text-primary-700">
                    {formatarMoeda(valorTotal, pais)}
                  </p>
                </React.Fragment>
              )}

function RecebimentoColaborador({ token }) {
  const toast = useToast();
  const [carregando, setCarregando] = useState(true);
  const [empresaInfo, setEmpresaInfo] = useState(null);
  const [codigo, setCodigo] = useState("");
  const [confirmando, setConfirmando] = useState(false);
  const [ultimaConfirmacao, setUltimaConfirmacao] = useState(null);

  const pais = empresaInfo?.pais || "BR";

  useEffect(() => {
    fetch("https://anbvaoegvvjqcfhurpet.supabase.co/functions/v1/buscar-empresa-token", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token }),
    }).then((r) => r.json()).then((data) => {
      setEmpresaInfo(data?.nome_empresa ? data : null);
      setCarregando(false);
    }).catch(() => setCarregando(false));
  }, [token]);

  async function confirmar(e) {
    e.preventDefault();
    if (!codigo.trim()) return;
    setConfirmando(true);
    setUltimaConfirmacao(null);
    try {
      const resp = await fetch("https://anbvaoegvvjqcfhurpet.supabase.co/functions/v1/confirmar-pagamento-token", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, codigo: codigo.trim() }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || t("cr_codigo_nao_encontrado", pais));
      toast.success(t("cr_confirmado_sucesso", pais));
      setUltimaConfirmacao({ ok: true, codigo: codigo.trim().toUpperCase() });
      setCodigo("");
    } catch (err) {
      setUltimaConfirmacao({ ok: false });
      toast.error(err instanceof Error ? err.message : t("cr_codigo_nao_encontrado", pais));
    } finally {
      setConfirmando(false);
    }
  }

  if (carregando) {
    return <div className="min-h-screen flex items-center justify-center"><Icon.Spinner className="h-6 w-6 text-primary-600" /></div>;
  }

  if (!empresaInfo) {
    return (
      <div className="bg-surface-gradient min-h-screen flex items-center justify-center px-5">
        <Card className="p-8 max-w-sm text-center">
          <p className="font-display text-lg font-semibold">{t("pub_link_invalido", "BR")}</p>
          <p className="text-slate-500 text-sm mt-1">{t("pub_peca_link_novo", "BR")}</p>
        </Card>
      </div>
    );
  }

  return (
    <div className="bg-surface-gradient min-h-screen flex items-center justify-center px-5 py-10">
      <div className="w-full max-w-sm">
        <div className="flex items-center gap-2 mb-6 justify-center">
          <Icon.Building className="text-primary-600 h-5 w-5" />
          <span className="font-display font-semibold">{empresaInfo.nome_empresa}</span>
        </div>
        <Card className="p-6">
          <h1 className="font-display text-lg font-semibold text-center">{t("pub_confirmar_recebimento", pais)}</h1>
          <p className="text-slate-500 text-sm text-center mt-1 mb-5">{t("pub_digite_codigo", pais)}</p>
          <form onSubmit={confirmar} className="space-y-3">
            <Input value={codigo} onChange={(e) => setCodigo(e.target.value)} placeholder="Ex: A1B2C3" className="text-center text-lg tracking-widest uppercase" maxLength={12} />
            <Button type="submit" className="w-full" loading={confirmando}>{t("pub_confirmar", pais)}</Button>
          </form>
          {ultimaConfirmacao?.ok && (
            <p className="text-primary-700 text-sm text-center mt-4">✓ {t("pub_codigo_confirmado", pais)} {ultimaConfirmacao.codigo} {t("pub_confirmado_txt", pais)}</p>
          )}
        </Card>
      </div>
    </div>
  );
}

============================================================ */
function AssinaturaBloqueio({ empresa, setScreen }) {
  const toast = useToast();
  const pais = empresa?.pais;
  const [preco, setPreco] = useState(null);
  const [processando, setProcessando] = useState(false);

  const assinaturaValida = empresa?.assinatura_status === "ativa" && empresa?.assinatura_pais === empresa?.pais;

  useEffect(() => {
    sb.from("precos_assinatura").select("*").eq("pais", pais || "BR").maybeSingle().then(({ data }) => setPreco(data || null));
  }, [pais]);

  const jaTinhaAssinatura = !!empresa?.assinatura_pais;

  async function assinar() {
    setProcessando(true);
    try {
      const { data: sessionData } = await sb.auth.getSession();
      const resp = await fetch("https://anbvaoegvvjqcfhurpet.supabase.co/functions/v1/criar-checkout-assinatura", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + sessionData.session.access_token },
      });
      const data = await resp.json();
      if (!resp.ok || !data.checkout_url) throw new Error(data.error || t("assin_erro", pais));
      window.location.href = data.checkout_url;
    } catch (err) {
      toast.error(err instanceof Error ? err.message : t("assin_erro", pais));
      setProcessando(false);
    }
  }

  async function gerenciar() {
    setProcessando(true);
    try {
      const { data: sessionData } = await sb.auth.getSession();
      const resp = await fetch("https://anbvaoegvvjqcfhurpet.supabase.co/functions/v1/criar-portal-assinatura", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + sessionData.session.access_token },
      });
      const data = await resp.json();
      if (!resp.ok || !data.portal_url) throw new Error(data.error || t("assin_erro_portal", pais));
      window.location.href = data.portal_url;
    } catch (err) {
      toast.error(err instanceof Error ? err.message : t("assin_erro_portal", pais));
      setProcessando(false);
    }
  }

  if (assinaturaValida) {
    const cancelada = !!empresa?.assinatura_cancelamento_agendado;
    return (
      <div className="mx-auto flex max-w-md flex-col items-center py-16 text-center">
        <span className={"mb-5 flex h-14 w-14 items-center justify-center rounded-2xl " + (cancelada ? "bg-amber-50 text-amber-600" : "bg-primary-50 text-primary-600")}>
          {cancelada ? <Icon.Bell className="h-7 w-7" /> : <Icon.Check className="h-7 w-7" />}
        </span>
        <h1 className="font-display text-2xl font-semibold">{cancelada ? t("assin_cancelamento_agendado", pais) : t("assin_ativa_titulo", pais)}</h1>
        {!cancelada && <p className="text-slate-500 mt-2 text-sm">{t("assin_ativa_desc", pais)}</p>}

        {preco && (
          <p className="font-display text-primary-700 mt-6 text-4xl font-semibold">
            {formatarMoeda(preco.valor, pais)}<span className="text-slate-400 text-base font-medium">{t("assin_mes", pais)}</span>
          </p>
        )}
        {empresa?.assinatura_valido_ate && (
          <p className="text-slate-400 text-xs mt-2">
            {(cancelada ? t("assin_acesso_ate", pais) : t("assin_renova_em", pais)) + " " + new Date(empresa.assinatura_valido_ate).toLocaleDateString()}
          </p>
        )}

        <Button variant="outline" className="mt-8 w-full" onClick={gerenciar} loading={processando}>{t("assin_gerenciar", pais)}</Button>
      </div>
    );
  }

  return (
    <div className="mx-auto flex max-w-md flex-col items-center py-16 text-center">
      <span className="bg-primary-50 text-primary-600 mb-5 flex h-14 w-14 items-center justify-center rounded-2xl"><Icon.Zap className="h-7 w-7" /></span>
      <h1 className="font-display text-2xl font-semibold">{t("assin_titulo", pais)}</h1>
      <p className="text-slate-500 mt-2 text-sm">{jaTinhaAssinatura ? t("assin_desc_pais_mudou", pais) : t("assin_desc_nova", pais)}</p>

      {preco && (
        <p className="font-display text-primary-700 mt-6 text-4xl font-semibold">
          {formatarMoeda(preco.valor, pais)}<span className="text-slate-400 text-base font-medium">{t("assin_mes", pais)}</span>
        </p>
      )}

      <Button className="mt-8 w-full" onClick={assinar} loading={processando}>{t("assin_botao", pais)}</Button>

      <button onClick={() => setScreen("cadastro-empresa")} className="text-slate-400 hover:text-slate-600 mt-4 text-xs underline">
        {t("assin_voltar_perfil", pais)}
      </button>
    </div>
  );
}

function App() {
  const [status, setStatus] = useState("loading"); // loading | auth | app
  const [screen, setScreen] = useState("dashboard"); // dashboard | cadastro-empresa | ativar-automacao
  const [empresa, setEmpresa] = useState(null);
  const [userEmail, setUserEmail] = useState(null);

  const carregarEmpresa = useCallback(async () => {
    const { data } = await sb.from("empresas").select("*").maybeSingle();
    setEmpresa(data || null);
    return data;
  }, []);

  const iniciar = useCallback(async () => {
    const { data: sessionData } = await sb.auth.getSession();
    if (!sessionData.session) { setStatus("auth"); return; }
    setUserEmail(sessionData.session.user?.email || null);
    const emp = await carregarEmpresa();
    setScreen(emp ? "dashboard" : "cadastro-empresa");
    setStatus("app");
  }, [carregarEmpresa]);

  useEffect(() => {
    iniciar();
    const { data: listener } = sb.auth.onAuthStateChange((event) => {
      if (event === "SIGNED_OUT") { setStatus("auth"); setEmpresa(null); }
    });
    return () => listener?.subscription?.unsubscribe();
  }, [iniciar]);

  // Assim que o webhook do Stripe confirmar o pagamento, a tela libera sozinha
  useEffect(() => {
    if (!empresa?.id) return;
    const channel = sb.channel("empresa-" + empresa.id)
      .on("postgres_changes", { event: "UPDATE", schema: "public", table: "empresas", filter: "id=eq." + empresa.id }, (payload) => {
        setEmpresa(payload.new);
      })
      .subscribe();
    return () => { sb.removeChannel(channel); };
  }, [empresa?.id]);

  async function onLogout() {
    await sb.auth.signOut();
    setStatus("auth");
  }

  async function onSavedEmpresa() {
    await carregarEmpresa();
    setScreen("dashboard");
  }

  if (status === "loading") {
    return <div className="min-h-screen flex items-center justify-center"><Icon.Spinner className="h-6 w-6 text-primary-600" /></div>;
  }

  if (status === "auth") {
    return <AuthPage onAuthed={iniciar} />;
  }

  if (!empresa && screen === "cadastro-empresa") {
    return <CadastroEmpresaPage empresa={empresa} onSaved={onSavedEmpresa} onVoltarLogin={onLogout} />;
  }

  const EMAILS_ACESSO_LIBERADO = ["jonatascne@gmail.com", "desouzamarialeonardo102@gmail.com"];
  const acessoLiberado = userEmail && EMAILS_ACESSO_LIBERADO.includes(userEmail.toLowerCase());
  const assinaturaValida = acessoLiberado || (empresa && empresa.assinatura_status === "ativa" && empresa.assinatura_pais === empresa.pais);
  const precisaAssinar = empresa && !assinaturaValida && screen !== "cadastro-empresa" && screen !== "assinatura";

  return (
    <DashboardShell screen={screen} setScreen={setScreen} onLogout={onLogout} pais={empresa?.pais} empresa={empresa}>
      {precisaAssinar ? (
        <AssinaturaBloqueio empresa={empresa} setScreen={setScreen} />
      ) : (
        <React.Fragment>
          {screen === "dashboard" && <DashboardPage empresa={empresa} setScreen={setScreen} />}
          {screen === "cadastro-empresa" && <CadastroEmpresaPage empresa={empresa} onSaved={onSavedEmpresa} setScreen={setScreen} />}
          {screen === "assinatura" && <AssinaturaBloqueio empresa={empresa} setScreen={setScreen} />}
          {screen === "ativar-automacao" && <AtivarAutomacaoPage empresa={empresa} setScreen={setScreen} />}
          {screen === "receber-online" && <ReceberOnlinePage empresa={empresa} />}
          {screen === "produtos" && <ProdutosServicosPage empresa={empresa} />}
          {screen === "pedidos" && <PedidosPage empresa={empresa} />}
          {screen === "codigo-recebimento" && <CodigoRecebimentoPage empresa={empresa} />}
          {screen === "integracoes" && <IntegracoesPage empresa={empresa} />}
          {screen === "notificacoes" && <NotificacoesPage empresa={empresa} />}
        </React.Fragment>
      )}
    </DashboardShell>
  );
}

function OrcamentoExterno({ pedidoId }) {
  const toast = useToast();
  const [carregando, setCarregando] = useState(true);
  const [dados, setDados] = useState(null);
  const [naoEncontrado, setNaoEncontrado] = useState(false);
  const [respostasExtra, setRespostasExtra] = useState({});
  const [formaPagamento, setFormaPagamento] = useState(null);
  const [etapa, setEtapa] = useState("form"); // form | enviando | aguardando | emitido | falha
  const [pedidoAtual, setPedidoAtual] = useState(null);
  const [codigoGerado, setCodigoGerado] = useState(null);

  const pais = dados?.empresa?.pais || "BR";

  useEffect(() => {
    fetch("https://anbvaoegvvjqcfhurpet.supabase.co/functions/v1/buscar-pedido-externo", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pedido_id: pedidoId }),
    }).then((r) => r.json()).then((data) => {
      if (data.error) { setNaoEncontrado(true); } else { setDados(data); }
      setCarregando(false);
    }).catch(() => { setNaoEncontrado(true); setCarregando(false); });
  }, [pedidoId]);

  useEffect(() => {
    if (!pedidoAtual) return;
    const channel = sb.channel("orc-" + pedidoAtual)
      .on("postgres_changes", { event: "UPDATE", schema: "public", table: "pedidos", filter: "id=eq." + pedidoAtual }, (payload) => {
        const s = payload.new.status;
        if (s === "emitido" || s === "confirmado_manual") setEtapa("emitido");
        else if (s === "falha_emissao" || s === "erro_validacao") setEtapa("falha");
      })
      .subscribe();
    return () => { sb.removeChannel(channel); };
  }, [pedidoAtual]);

  async function enviar(e) {
    e.preventDefault();
    if (!formaPagamento) { toast.error(t("pub_escolha_pagamento", pais)); return; }
    setEtapa("enviando");
    try {
      const resp = await fetch("https://anbvaoegvvjqcfhurpet.supabase.co/functions/v1/completar-pedido-externo", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pedido_id: pedidoId, respostas_extra: respostasExtra, forma_pagamento: formaPagamento }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || t("pub_erro_enviar", pais));
      setPedidoAtual(pedidoId);
      setCodigoGerado(data.codigo_recebimento || null);
      if (formaPagamento === "cartao" && data.checkout_url) { window.location.href = data.checkout_url; return; }
      setEtapa("aguardando");
    } catch (err) {
      toast.error(err instanceof Error ? err.message : t("pub_erro_enviar", pais));
      setEtapa("form");
    }
  }

  if (carregando) return <div className="min-h-screen flex items-center justify-center"><Icon.Spinner className="h-6 w-6 text-primary-600" /></div>;

  if (naoEncontrado || !dados) {
    return (
      <div className="bg-surface-gradient min-h-screen flex items-center justify-center px-5">
        <Card className="p-8 max-w-sm text-center">
          <p className="font-display text-lg font-semibold">{t("pub_link_invalido", "BR")}</p>
          <p className="text-slate-500 text-sm mt-1">{t("pub_link_expirado", "BR")}</p>
        </Card>
      </div>
    );
  }

  const respostasIniciais = dados.respostas_iniciais || {};
  const chavePagamentoInstantaneo = pais === "ES" ? dados.empresa?.iban : dados.empresa?.pix_chave;
  const temaColab = dados.empresa?.tema_loja || "padrao";
  const mostrarHeroColab = !!TEMAS_LOJA[temaColab]?.hero && dados.empresa && etapa === "form";

  return (
    <div className={(mostrarHeroColab ? "" : "bg-surface-gradient ") + "min-h-screen pb-10"}>
      {dados.empresa && etapa === "form" && <CabecalhoLoja empresa={dados.empresa} largura="max-w-xl" />}
      <div className={"mx-auto max-w-xl px-5" + (dados.empresa && etapa === "form" ? "" : " pt-10")}>

        {etapa === "form" || etapa === "enviando" ? (
          <Card className="p-6">
            <p className="font-display text-xl font-semibold mb-1">{dados.nome_item}</p>
            {dados.valor != null && (
              <p className="font-display text-primary-700 text-2xl font-semibold mb-4">{formatarMoeda(dados.valor, pais)}</p>
            )}

            <div className="bg-slate-50 rounded-lg px-4 py-3 mb-4 text-sm space-y-1">
              {respostasIniciais.nome_completo && <p><span className="text-slate-400">{t("cad_nome_completo", pais)}:</span> {respostasIniciais.nome_completo}</p>}
              {respostasIniciais.nome_obra && <p><span className="text-slate-400">{pais === "ES" ? "Obra" : pais === "US" ? "Project" : "Obra"}:</span> {respostasIniciais.nome_obra}</p>}
              {respostasIniciais.endereco && <p><span className="text-slate-400">{pais === "ES" ? "Dirección" : pais === "US" ? "Address" : "Endereço"}:</span> {respostasIniciais.endereco}</p>}
            </div>

            <form onSubmit={enviar} className="space-y-4">
              {(dados.campos_adicionais || []).map((campo) => (
                <CampoFormularioPublico key={campo.chave} campo={{ id: campo.chave, rotulo: campo.rotulo, tipo_dado: campo.tipo_dado, obrigatorio: campo.obrigatorio }}
                  valor={respostasExtra[campo.chave]} onChange={(v) => setRespostasExtra((r) => ({ ...r, [campo.chave]: v }))} />
              ))}

              <div>
                <Label>{t("pub_forma_pagamento", pais)}</Label>
                <div className="grid gap-2 sm:grid-cols-2">
                  {dados.aceita_cartao && (
                    <button type="button" onClick={() => setFormaPagamento("cartao")}
                      className={"rounded-lg border px-3 py-2.5 text-sm font-medium " + (formaPagamento === "cartao" ? "border-primary-500 bg-primary-50 text-primary-700" : "border-slate-300 text-slate-600")}>
                      <Icon.Zap className="h-4 w-4 inline mr-1.5" />{t("pub_pagar_online", pais)}
                    </button>
                  )}
                  {chavePagamentoInstantaneo ? (
                    <button type="button" onClick={() => setFormaPagamento("pix")}
                      className={"rounded-lg border px-3 py-2.5 text-sm font-medium " + (formaPagamento === "pix" ? "border-primary-500 bg-primary-50 text-primary-700" : "border-slate-300 text-slate-600")}>
                      {t("pub_pix", pais)}
                    </button>
                  ) : null}
                  <button type="button" onClick={() => setFormaPagamento("cartao_presencial")}
                    className={"rounded-lg border px-3 py-2.5 text-sm font-medium " + (formaPagamento === "cartao_presencial" ? "border-primary-500 bg-primary-50 text-primary-700" : "border-slate-300 text-slate-600")}>
                    <Icon.Card className="h-4 w-4 inline mr-1.5" />{t("pub_cartao_entrega", pais)}
                  </button>
                  <button type="button" onClick={() => setFormaPagamento("dinheiro")}
                    className={"rounded-lg border px-3 py-2.5 text-sm font-medium " + (formaPagamento === "dinheiro" ? "border-primary-500 bg-primary-50 text-primary-700" : "border-slate-300 text-slate-600")}>
                    {t("pub_dinheiro", pais)}
                  </button>
                </div>
              </div>

              <Button type="submit" className="w-full" loading={etapa === "enviando"}>{t("pub_finalizar_pedido", pais)}</Button>
            </form>
          </Card>
        ) : etapa === "aguardando" ? (
          <Card className="p-8 text-center">
            {formaPagamento === "pix" && chavePagamentoInstantaneo && (
              <div className="bg-slate-50 rounded-lg px-4 py-3 text-left">
                <p className="text-xs font-semibold text-slate-600 mb-1">{t("pub_chave_pix", pais)}</p>
                <p className="text-sm font-mono break-all">{chavePagamentoInstantaneo}</p>
              </div>
            )}
            {formaPagamento === "pix" && pedidoId && <UploadComprovantePix pedidoId={pedidoId} pais={pais} />}
            {(formaPagamento === "dinheiro" || formaPagamento === "cartao_presencial") && codigoGerado && (
              <div className="border-2 border-amber-300 bg-amber-50 rounded-lg px-4 py-4 text-left">
                <p className="text-amber-800 text-sm font-bold mb-1.5">⚠️ {t("pub_guarde_codigo_aviso", pais)}</p>
                <p className="text-3xl font-bold tracking-widest text-center my-2">{codigoGerado}</p>
                <p className="text-amber-700 text-xs mt-1.5">{t("pub_guarde_codigo_desc", pais)}</p>
              </div>
            )}
          </Card>
        ) : etapa === "emitido" ? (
          <Card className="p-8 text-center">
            <Icon.Check className="h-10 w-10 text-primary-600 mx-auto mb-4" />
            <p className="font-display text-lg font-semibold">{t("pub_confirmado", pais)}</p>
            <p className="text-slate-500 text-sm mt-2">{t("pub_nota_emitida", pais)}</p>
          </Card>
        ) : (
          <Card className="p-8 text-center">
            <p className="font-display text-lg font-semibold text-amber-700">{t("pub_recebemos", pais)}</p>
            <p className="text-slate-500 text-sm mt-2">{t("pub_problema", pais)}</p>
          </Card>
        )}
      </div>
    </div>
  );
}

function RootRouter() {
  const [hash, setHash] = useState(window.location.hash);
  useEffect(() => {
    function onHashChange() { setHash(window.location.hash); }
    window.addEventListener("hashchange", onHashChange);
    return () => window.removeEventListener("hashchange", onHashChange);
  }, []);

  if (hash.startsWith("#loja/")) {
    return <LojaPublica slug={decodeURIComponent(hash.slice(6))} />;
  }
  if (hash.startsWith("#produto/")) {
    return <ProdutoPublico slug={decodeURIComponent(hash.slice(9))} />;
  }
  if (hash.startsWith("#recebimento/")) {
    return <RecebimentoColaborador token={decodeURIComponent(hash.slice(13))} />;
  }
  if (hash.startsWith("#orcamento/")) {
    return <OrcamentoExterno pedidoId={decodeURIComponent(hash.slice(11))} />;
  }
  return <App />;
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <ToastProvider><RootRouter /></ToastProvider>
);
</script>
<script>
  // Transpila o bloco JSX manualmente, forçando o runtime clássico do React
  // (React.createElement) em vez do runtime automático (que depende de
  // "import" e só funciona com bundler). Isso é o que faz o app rodar
  // direto no navegador via CDN, sem build.
  (function () {
    var source = document.getElementById("app-source").textContent;
    var output = Babel.transform(source, {
      presets: [["react", { runtime: "classic" }], "env"],
    }).code;
    var script = document.createElement("script");
    script.textContent = output;
    document.body.appendChild(script);
  })();
</script>
</body>
</html>
