  try {
    const lang = (navigator.language || navigator.userLanguage || "pt-BR").toLowerCase();

/* ============================================================
   TOASTS
============================================================ */
const ToastContext = createContext(null);
function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  const push = useCallback((type, message) => {
    const id = Date.now() + Math.random();
    setToasts((t) => [...t, { id, type, message }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 4000);
  }, []);
  const api = {
    success: (m) => push('success', m),
    error: (m) => push('error', m),
    info: (m) => push('info', m),
  };
  return (
    <ToastContext.Provider value={api}>
      {children}
      <div className="fixed bottom-4 right-4 z-[100] flex flex-col gap-2 max-w-sm w-full px-4 sm:px-0">
        {toasts.map((t) => (
          <div key={t.id} className={
            "toast-enter rounded-lg px-4 py-3 text-sm shadow-lg border " +
            (t.type === 'success' ? "bg-emerald-600 text-white border-emerald-700" :
             t.type === 'error' ? "bg-red-600 text-white border-red-700" :
             "bg-slate-800 text-white border-slate-900")
          }>
            {t.message}
          </div>
        ))}
      </div>
    </ToastContext.Provider>
  );
}
function useToast() { return useContext(ToastContext); }

function Button({ children, variant = "default", className = "", loading, ...props }) {
  const base = "inline-flex items-center justify-center gap-2 rounded-lg text-sm font-medium transition-colors px-4 py-2.5 disabled:opacity-60 disabled:cursor-not-allowed";
  const variants = {
    default: "bg-primary-600 text-white hover:bg-primary-700",
    outline: "border border-slate-300 bg-white text-slate-700 hover:bg-slate-50",
    ghost: "text-slate-600 hover:bg-slate-100",
  };
  return (
    <button className={base + " " + variants[variant] + " " + className} disabled={loading || props.disabled} {...props}>
      {loading && <Icon.Spinner className="h-4 w-4" />}
      {children}
    </button>
  );
}
function Input(props) {
  return <input {...props} className={"w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 " + (props.className||"")} />;
}
function Label({ children, ...props }) {
  return <label {...props} className="block text-sm font-medium text-slate-700 mb-1.5">{children}</label>;
}
function Card({ children, className="" }) {
  return <div className={"rounded-xl border border-slate-200 bg-white shadow-card " + className}>{children}</div>;
}

    e.preventDefault();

    const form = new FormData(e.currentTarget);
    const { error } = await sb.auth.signInWithPassword({
      email: String(form.get("email") || ""),
      password: String(form.get("senha") || ""),
    });
    setLoading(false);
    if (error) {
      toast.error(error.message === "Invalid login credentials" ? t("auth_credenciais_invalidas", pais) : error.message);

    }
    onAuthed();
  }

async function detectarTipoImagem(file) {
  const buffer = await file.slice(0, 12).arrayBuffer();
  const b = new Uint8Array(buffer);
  if (b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4e && b[3] === 0x47) return "image/png";
  if (b[0] === 0xff && b[1] === 0xd8 && b[2] === 0xff) return "image/jpeg";
  if (b[0] === 0x52 && b[1] === 0x49 && b[2] === 0x46 && b[3] === 0x46 && b[8] === 0x57 && b[9] === 0x45 && b[10] === 0x42 && b[11] === 0x50) return "image/webp";
  return null;
}

function CadastroEmpresaPage({ empresa, onSaved, setScreen, onVoltarLogin }) {
  const toast = useToast();
  const [loading, setLoading] = useState(false);
  const [logoPreview, setLogoPreview] = useState(null);
  const [logoFile, setLogoFile] = useState(null);
  const [logoTipo, setLogoTipo] = useState(null);
  const [pais, setPais] = useState(empresa?.pais || null);
  const [regime, setRegime] = useState(empresa?.regime_fiscal || "");
  const fileRef = useRef(null);
  const formRef = useRef(null);

  useEffect(() => {
    if (empresa?.logo_url) {
      sb.storage.from("logos-empresas").createSignedUrl(empresa.logo_url, 3600).then(({ data }) => {
        if (data?.signedUrl) setLogoPreview(data.signedUrl);
      });
    }
  }, [empresa]);

  async function handleLogo(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) { toast.error(t("cad_logo_erro_tamanho", pais)); return; }
    const tipoReal = await detectarTipoImagem(file);
    if (!tipoReal) { toast.error(t("cad_logo_erro_tipo", pais)); e.target.value = ""; return; }
    setLogoTipo(tipoReal);
    setLogoFile(file);
    setLogoPreview(URL.createObjectURL(file));
  }

  function trocarPais(novoPais) {
    if (novoPais === pais) return;
    const aviso = {
      BR: "Trocar de país vai limpar os campos fiscais (CNPJ/CPF, PIX, endereço) e desconectar sua automação fiscal atual, já que ela é específica de cada país. Você vai precisar reconectar depois. Continuar?",
      ES: "Cambiar de país borrará los campos fiscales (NIF/NIE, IBAN, dirección) y desconectará tu automatización fiscal actual, ya que es específica de cada país. Tendrás que reconectarla después. ¿Continuar?",
      US: "Changing country will clear your tax fields (EIN/SSN, address) and disconnect your current tax automation, since it's country-specific. You'll need to reconnect it afterward. Continue?",
    }[pais] || "Trocar de país vai limpar os campos fiscais e desconectar sua automação fiscal atual. Continuar?";

    if (!window.confirm(aviso)) return;

    setPais(novoPais);
    setRegime("");
    if (formRef.current) {
      ["cnpj_cpf", "pix_chave", "iban", "direccion", "codigo_postal", "provincia"].forEach((campo) => {
        const el = formRef.current.elements.namedItem(campo);
        if (el) el.value = "";
      });
    }
  }

  async function handleSubmit(e) {
    e.preventDefault();
    setLoading(true);
    try {
      const { data: userData } = await sb.auth.getUser();
      const user = userData.user;
      if (!user) throw new Error(t("cad_sessao_expirada", pais));

      const paisMudou = empresa && empresa.pais !== pais;

      const form = new FormData(formRef.current);
      let logoPath = empresa?.logo_url ?? null;

      if (logoFile) {
        const ext = logoTipo === "image/png" ? "png" : logoTipo === "image/jpeg" ? "jpg" : "webp";
        const path = user.id + "/logo-" + Date.now() + "." + ext;
        const { error: upErr } = await sb.storage.from("logos-empresas").upload(path, logoFile, { upsert: true, contentType: logoTipo });
        if (upErr) throw upErr;
        logoPath = path;
      }

      const payload = {
        user_id: user.id,
        pais,
        nome_completo: String(form.get("nome_completo") || ""),
        nome_empresa: String(form.get("nome_empresa") || ""),
        cnpj_cpf: String(form.get("cnpj_cpf") || ""),
        telefone: String(form.get("telefone") || ""),
        email: String(form.get("email") || ""),
        pix_chave: pais === "BR" ? (String(form.get("pix_chave") || "") || null) : null,
        iban: pais === "ES" ? (String(form.get("iban") || "") || null) : null,
        regime_fiscal: regime || null,
        aliquota_iss: pais === "BR" ? (form.get("aliquota_iss") ? Number(form.get("aliquota_iss")) : null) : null,
        direccion: (pais === "ES" || pais === "US") ? (String(form.get("direccion") || "") || null) : null,
        codigo_postal: (pais === "ES" || pais === "US") ? (String(form.get("codigo_postal") || "") || null) : null,
        provincia: (pais === "ES" || pais === "US") ? (String(form.get("provincia") || "") || null) : null,
        logo_url: logoPath,
      };
      if (!empresa?.slug_loja) {
        payload.slug_loja = slugify(payload.nome_empresa) + "-" + Math.random().toString(36).slice(2, 6);
      }

      const { error } = empresa
        ? await sb.from("empresas").update(payload).eq("id", empresa.id)
        : await sb.from("empresas").insert(payload);
      if (error) throw error;

      // País mudou: a conexão fiscal antiga é de outro país, não vale mais.
      // Usa a Edge Function pra também limpar a credencial guardada no Vault, não só a linha da tabela.
      if (paisMudou) {
        const { data: sessionData } = await sb.auth.getSession();
        await fetch("https://anbvaoegvvjqcfhurpet.supabase.co/functions/v1/desconectar-fiscal", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + sessionData.session.access_token },
        }).catch(() => {});
      }

      toast.success(t("cad_salvo", pais));
      onSaved();
    } catch (err) {
      toast.error(err instanceof Error ? err.message : t("cad_erro_salvar", pais));
    } finally {
      setLoading(false);
    }
  }

  // Cadastro novo: primeiro escolhe o país, antes de qualquer outro campo
  if (!empresa && !pais) {
    return (
      <main className="bg-surface-gradient min-h-screen px-5 py-10">
        <div className="mx-auto max-w-md">
          <div className="mb-8 flex items-center gap-2">
            <Icon.Logo className="text-primary-600 h-6 w-6" />
            <span className="font-display text-lg font-semibold">Automação de Notas</span>
          </div>
          <Card className="p-6">
            {onVoltarLogin && (
              <button onClick={onVoltarLogin} className="text-slate-500 hover:text-slate-700 flex items-center gap-1.5 text-xs font-medium mb-4">
                <Icon.ArrowLeft className="h-3.5 w-3.5" />{t("voltar", "BR")}
              </button>
            )}
            <h2 className="font-display text-2xl font-semibold">{t("pais_titulo", "BR")}</h2>
            <p className="text-slate-500 mt-1 text-sm mb-6">{t("pais_subtitulo", "BR")}</p>
            <div className="grid gap-3">
              <button onClick={() => setPais("BR")} className="border-slate-200 hover:border-primary-300 shadow-card rounded-xl border p-5 text-left">
                <p className="font-display font-semibold">🇧🇷 {t("pais_br", "BR")}</p>
                <p className="text-slate-500 text-sm mt-1">{t("pais_br_desc", "BR")}</p>
              </button>
              <button onClick={() => setPais("ES")} className="border-slate-200 hover:border-primary-300 shadow-card rounded-xl border p-5 text-left">
                <p className="font-display font-semibold">🇪🇸 {t("pais_es", "ES")}</p>
                <p className="text-slate-500 text-sm mt-1">{t("pais_es_desc", "ES")}</p>
              </button>
              <button onClick={() => setPais("US")} className="border-slate-200 hover:border-primary-300 shadow-card rounded-xl border p-5 text-left">
                <p className="font-display font-semibold">🇺🇸 {t("pais_us", "US")}</p>
                <p className="text-slate-500 text-sm mt-1">{t("pais_us_desc", "US")}</p>
              </button>
            </div>
          </Card>
        </div>
      </main>
    );
  }

  const conteudo = (
    <div className="mx-auto max-w-2xl">
      {!empresa && (
        <div className="mb-8 flex items-center gap-2">
          <Icon.Logo className="text-primary-600 h-6 w-6" />
          <span className="font-display text-lg font-semibold">Automação de Notas</span>
        </div>
      )}
      <Card className="p-6">
        {!empresa && (
          <button onClick={() => setPais(null)} className="text-slate-500 hover:text-slate-700 flex items-center gap-1.5 text-xs font-medium mb-4">
            <Icon.ArrowLeft className="h-3.5 w-3.5" />{t("voltar", pais)}
          </button>
        )}
        <h2 className="font-display text-2xl font-semibold">{empresa ? t("cad_titulo_editar", pais) : t("cad_titulo", pais)}</h2>
        <p className="text-slate-500 mt-1 text-sm mb-6">{t("cad_subtitulo", pais)}</p>

        {empresa && (
          <div className="mb-6 border-b border-slate-100 pb-6">
            <Label>{t("pais_titulo", pais)}</Label>
            <div className="grid gap-2 sm:grid-cols-3">
              <button type="button" onClick={() => trocarPais("BR")}
                className={"rounded-lg border px-3 py-2.5 text-sm font-medium " + (pais === "BR" ? "border-primary-500 bg-primary-50 text-primary-700" : "border-slate-300 text-slate-600")}>
                🇧🇷 {t("pais_br", pais)}
              </button>
              <button type="button" onClick={() => trocarPais("ES")}
                className={"rounded-lg border px-3 py-2.5 text-sm font-medium " + (pais === "ES" ? "border-primary-500 bg-primary-50 text-primary-700" : "border-slate-300 text-slate-600")}>
                🇪🇸 {t("pais_es", pais)}
              </button>
              <button type="button" onClick={() => trocarPais("US")}

                🇺🇸 {t("pais_us", pais)}
              </button>
            </div>
          </div>
        )}

        <form ref={formRef} onSubmit={handleSubmit} className="space-y-6">
          <div className="flex items-center gap-4">
            <button type="button" onClick={() => fileRef.current?.click()}

            <div>
              <p className="text-sm font-medium">{t("cad_logo", pais)}</p>

              <input ref={fileRef} type="file" accept="image/png,image/jpeg,image/webp" className="hidden" onChange={handleLogo} />
            </div>
          </div>

          {pais === "ES" ? (
            <div className="grid gap-4 sm:grid-cols-2">
              <div><Label htmlFor="nome_completo">{t("cad_nome_completo", pais)}</Label><Input id="nome_completo" name="nome_completo" required maxLength={120} defaultValue={empresa?.nome_completo || ""} placeholder="María López" /></div>
              <div><Label htmlFor="nome_empresa">{t("cad_nome_empresa", pais)}</Label><Input id="nome_empresa" name="nome_empresa" required maxLength={120} defaultValue={empresa?.nome_empresa || ""} placeholder="López Servicios S.L." /></div>
              <div><Label htmlFor="cnpj_cpf">{t("cad_doc", pais)}</Label><Input id="cnpj_cpf" name="cnpj_cpf" required maxLength={18} defaultValue={empresa?.cnpj_cpf || ""} placeholder="12345678A" /></div>
              <div><Label htmlFor="telefone">{t("cad_telefone", pais)}</Label><Input id="telefone" name="telefone" required maxLength={20} defaultValue={empresa?.telefone || ""} placeholder="+34 600 000 000" /></div>
              <div><Label htmlFor="email">{t("cad_email", pais)}</Label><Input id="email" name="email" type="email" required defaultValue={empresa?.email || ""} placeholder="contacto@empresa.es" /></div>
              <div>
                <Label htmlFor="regime_fiscal">{t("cad_regime", pais)}</Label>

                  className="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                  <option value="">{t("cad_selecione", pais)}</option>

                  <option value="otra">Otra</option>

              <div><Label htmlFor="direccion">Dirección</Label><Input id="direccion" name="direccion" maxLength={200} defaultValue={empresa?.direccion || ""} placeholder="Calle Mayor, 12" /></div>
              <div><Label htmlFor="codigo_postal">Código postal</Label><Input id="codigo_postal" name="codigo_postal" maxLength={10} defaultValue={empresa?.codigo_postal || ""} placeholder="45510" /></div>
              <div><Label htmlFor="provincia">Provincia</Label><Input id="provincia" name="provincia" maxLength={80} defaultValue={empresa?.provincia || ""} placeholder="Toledo" /></div>
              <div><Label htmlFor="iban">IBAN <span className="text-slate-400 font-normal">{t("cad_opcional", pais)}</span></Label><Input id="iban" name="iban" maxLength={34} defaultValue={empresa?.iban || ""} placeholder="ES00 0000 0000 0000 0000 0000" /></div>
            </div>
          ) : pais === "US" ? (
            <div className="grid gap-4 sm:grid-cols-2">
              <div><Label htmlFor="nome_completo">{t("cad_nome_completo", pais)}</Label><Input id="nome_completo" name="nome_completo" required maxLength={120} defaultValue={empresa?.nome_completo || ""} placeholder="Jane Smith" /></div>
              <div><Label htmlFor="nome_empresa">{t("cad_nome_empresa", pais)}</Label><Input id="nome_empresa" name="nome_empresa" required maxLength={120} defaultValue={empresa?.nome_empresa || ""} placeholder="Smith Services LLC" /></div>
              <div><Label htmlFor="cnpj_cpf">{t("cad_doc", pais)}</Label><Input id="cnpj_cpf" name="cnpj_cpf" required maxLength={18} defaultValue={empresa?.cnpj_cpf || ""} placeholder="12-3456789" /></div>
              <div><Label htmlFor="telefone">{t("cad_telefone", pais)}</Label><Input id="telefone" name="telefone" required maxLength={20} defaultValue={empresa?.telefone || ""} placeholder="+1 (555) 000-0000" /></div>
              <div><Label htmlFor="email">{t("cad_email", pais)}</Label><Input id="email" name="email" type="email" required defaultValue={empresa?.email || ""} placeholder="contact@company.com" /></div>
              <div>
                <Label htmlFor="regime_fiscal">{t("cad_regime", pais)}</Label>

                  <option value="outra">Other</option>
                </select>
              </div>
              <div><Label htmlFor="direccion">Address</Label><Input id="direccion" name="direccion" maxLength={200} defaultValue={empresa?.direccion || ""} placeholder="123 Main St" /></div>
              <div><Label htmlFor="codigo_postal">ZIP code</Label><Input id="codigo_postal" name="codigo_postal" maxLength={10} defaultValue={empresa?.codigo_postal || ""} placeholder="90001" /></div>
              <div><Label htmlFor="provincia">State</Label><Input id="provincia" name="provincia" maxLength={80} defaultValue={empresa?.provincia || ""} placeholder="California" /></div>
            </div>
          ) : (
            <div className="grid gap-4 sm:grid-cols-2">

              <div>

                  <option value="">{t("cad_selecione", pais)}</option>
                  <option value="mei">MEI</option>
                  <option value="simples_nacional">Simples Nacional</option>
                  <option value="lucro_presumido">Lucro Presumido</option>
                  <option value="lucro_real">Lucro Real</option>
                </select>
              </div>
              <div><Label htmlFor="aliquota_iss">{t("cad_aliquota", pais)}</Label><Input id="aliquota_iss" name="aliquota_iss" type="number" step="0.01" min="0" max="100" defaultValue={empresa?.aliquota_iss ?? ""} placeholder="2.00" /></div>
            </div>
          )}

          <div className="flex gap-2">
            <Button type="submit" className="flex-1" loading={loading}>
              {empresa ? t("cad_salvar_alteracoes", pais) : t("cad_salvar", pais)}
            </Button>
            {empresa && setScreen && (
              <Button type="button" variant="ghost" onClick={() => setScreen("dashboard")}>
                {t("cancelar", pais)}
              </Button>
            )}
          </div>
        </form>
      </Card>
    </div>
  );

  if (!empresa) {
    return <main className="bg-surface-gradient min-h-screen px-5 py-10">{conteudo}</main>;
  }
  return conteudo;
}

function DashboardShell({ children, screen, setScreen, onLogout, pais, empresa }) {
  const [aberto, setAberto] = useState(false);
  const [naoLidas, setNaoLidas] = useState(0);
  const [balancar, setBalancar] = useState(false);
  const navItems = getNavItems(pais);

  const buscarContagem = useCallback(() => {
    if (!empresa?.id) return;
    sb.from("notificacoes").select("id", { count: "exact", head: true })
      .eq("empresa_id", empresa.id).eq("lida", false)
      .then(({ count }) => setNaoLidas(count || 0));
  }, [empresa]);

  useEffect(() => { buscarContagem(); }, [buscarContagem]);

  // Ao entrar na tela de notificações, some com o número (a própria página marca como lida)
  useEffect(() => { if (screen === "notificacoes") buscarContagem(); }, [screen, buscarContagem]);

  useEffect(() => {
    if (!empresa?.id) return;
    const channel = sb.channel("notificacoes-sino-" + empresa.id)
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "notificacoes", filter: "empresa_id=eq." + empresa.id }, () => {
        buscarContagem();
        setBalancar(true);
        setTimeout(() => setBalancar(false), 1000);
      })
      .on("postgres_changes", { event: "UPDATE", schema: "public", table: "notificacoes", filter: "empresa_id=eq." + empresa.id }, () => {
        buscarContagem();
      })
      .subscribe();
    return () => { sb.removeChannel(channel); };
  }, [empresa, buscarContagem]);

  const NavList = () => (
    <nav className="flex flex-col gap-1">
      {navItems.map((item) => {
        const IconC = item.icone;
        const ehNotificacoes = item.key === "notificacoes";
        if (!item.pronto) {
          return (
            <span key={item.key} title="Em breve" className="text-slate-400 flex cursor-not-allowed items-center gap-2.5 rounded-md px-3 py-2 text-sm">
              <IconC className="h-4 w-4" />{item.rotulo}
            </span>
          );
        }
        const ativo = screen === item.key;
        return (
          <button key={item.key} onClick={() => { setScreen(item.key); setAberto(false); }}
            className={"flex items-center justify-between gap-2.5 rounded-md px-3 py-2 text-sm transition-colors text-left " +
              (ativo ? "bg-primary-50 text-primary-700 font-medium" : "text-slate-600 hover:bg-slate-100 hover:text-slate-900")}>
            <span className="flex items-center gap-2.5">
              <IconC className={"h-4 w-4 " + (ehNotificacoes && balancar ? "anim-sino" : "")} />{item.rotulo}
            </span>
            {ehNotificacoes && naoLidas > 0 && (
              <span className="bg-red-500 flex h-5 min-w-[1.25rem] items-center justify-center rounded-full px-1 text-[11px] font-semibold text-white">
                {naoLidas > 99 ? "99+" : naoLidas}
              </span>
            )}
          </button>
        );
      })}
    </nav>
  );

  return (
    <div className="bg-surface-gradient min-h-screen">
      <div className="mx-auto flex max-w-7xl">
        <aside className="bg-white/60 sticky top-0 hidden h-screen w-60 shrink-0 flex-col border-r border-slate-200 px-4 py-6 md:flex">
          <div className="mb-8 flex items-center gap-2 px-2">
            <Icon.Logo className="text-primary-600 h-5 w-5" />
            <span className="font-display text-sm font-semibold">Automação de Notas</span>
          </div>
          <NavList />
          <div className="mt-auto">
            <Button variant="outline" className="w-full" onClick={onLogout}><Icon.LogOut className="h-4 w-4" />{t("sair", pais)}</Button>
          </div>
        </aside>

        <div className="min-w-0 flex-1">
          <header className="bg-white/60 flex items-center justify-between border-b border-slate-200 px-4 py-3 md:hidden">
            <div className="flex items-center gap-2">
              <Icon.Logo className="text-primary-600 h-5 w-5" />
              <span className="font-display text-sm font-semibold">Automação de Notas</span>
            </div>
            <button onClick={() => setAberto((v) => !v)} className="relative p-2">
              <Icon.Menu className="h-5 w-5" />
              {naoLidas > 0 && <span className="bg-red-500 absolute right-1 top-1 h-2 w-2 rounded-full" />}
            </button>
          </header>
          {aberto && (
            <div className="border-b border-slate-200 px-4 py-3 md:hidden">
              <NavList />
              <Button variant="outline" className="mt-3 w-full" onClick={onLogout}><Icon.LogOut className="h-4 w-4" />{t("sair", pais)}</Button>
            </div>
          )}
          <main className="px-5 py-8 md:px-8 md:py-10">{children}</main>
        </div>
      </div>
    </div>
  );
}

function linkWhatsapp(telefone, pais) {
  if (!telefone) return null;
  let digitos = telefone.replace(/\D/g, "");
  const ddi = { BR: "55", ES: "34", US: "1" }[pais] || "55";
  if (!digitos.startsWith(ddi)) digitos = ddi + digitos;
  return "https://wa.me/" + digitos;
}

/* Contato AIVACS pra contratação de configuração da plataforma:
   BR cai no WhatsApp do Brasil em português; ES e US caem no WhatsApp da Espanha (ES em espanhol, US em inglês). */
function linkContratarConfiguracao(pais) {
  const CONTATOS = {
    BR: { numero: "5544999095969", texto: "Olá, quero marcar a configuração da plataforma para minha empresa." },

function formatarMoeda(valor, pais) {
  const config = { BR: ["pt-BR", "BRL"], ES: ["es-ES", "EUR"], US: ["en-US", "USD"] }[pais] || ["pt-BR", "BRL"];
  return Number(valor || 0).toLocaleString(config[0], { style: "currency", currency: config[1] });

  const periodoAtual = PERIODOS.find((p) => p.key === periodo);
  const pedidosFiltrados = React.useMemo(() => {
    if (!periodoAtual?.dias) return pedidos;
    const limite = Date.now() - periodoAtual.dias * 24 * 60 * 60 * 1000;
    return pedidos.filter((p) => new Date(p.criado_em).getTime() >= limite);

  const total = pedidosFiltrados.length;

function slugify(texto) {
  return texto
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/(^-|-$)/g, "")
    .slice(0, 40);
}

function SeletorTemaLoja({ empresa }) {
  const toast = useToast();
  const pais = empresa?.pais;
  const [tema, setTema] = useState(empresa?.tema_loja || "padrao");
  const [salvando, setSalvando] = useState(false);

  async function escolher(novoTema) {
    if (novoTema === tema || salvando) return;
    setSalvando(true);
    const { error } = await sb.from("empresas").update({ tema_loja: novoTema }).eq("id", empresa.id);
    setSalvando(false);
    if (error) { toast.error(error.message); return; }
    setTema(novoTema);
    empresa.tema_loja = novoTema;
    toast.success(t("tema_salvo", pais));
  }

  const OPCOES = Object.keys(TEMAS_LOJA);

  return (
    <Card className="p-6 mb-6">
      <h3 className="font-display text-lg font-semibold">{t("tema_titulo", pais)}</h3>
      <p className="text-slate-500 text-sm mb-4">{t("tema_subtitulo", pais)}</p>
      <div className="grid gap-3 sm:grid-cols-3">
        {OPCOES.map((key) => {
          const cfg = TEMAS_LOJA[key];
          return (
            <button key={key} type="button" onClick={() => escolher(key)} disabled={salvando}
              className={"rounded-xl border-2 p-3 text-left transition-colors disabled:opacity-60 " + (tema === key ? "border-primary-500" : "border-transparent hover:border-slate-200")}>
              {cfg.thumb ? (
                <div className="mb-3 h-16 w-full rounded-lg bg-cover bg-center border border-slate-200" style={{ backgroundImage: "url(" + cfg.thumb + ")" }} />
              ) : (
                <div className="mb-3 h-16 w-full rounded-lg bg-gradient-to-br from-emerald-50 to-white border border-slate-200" />
              )}
              <p className="flex items-center gap-1.5 text-sm font-semibold">
                {tema === key && <Icon.Check className="text-primary-600 h-3.5 w-3.5" />}
                {t("tema_" + key, pais)}
              </p>
              <p className="text-slate-500 text-xs mt-0.5">{t("tema_" + key + "_desc", pais)}</p>

        })}

  const tiposOperacao = getTiposOperacao(pais);

  const carregar = useCallback(async () => {
    if (!empresa?.id) { setCarregando(false); return; }
    setCarregando(true);
    const { data } = await sb.from("produtos_servicos").select("*").eq("empresa_id", empresa.id).order("created_at", { ascending: false });
    setProdutos(data || []);
    setCarregando(false);
  }, [empresa]);

  useEffect(() => { carregar(); }, [carregar]);

  function copiarLink(produto) {
    const url = window.location.origin + window.location.pathname + "#produto/" + produto.slug_checkout;
    navigator.clipboard.writeText(url).then(() => {
      setLinkCopiadoId(produto.id);
      toast.success(t("cr_link_copiado", pais));
      setTimeout(() => setLinkCopiadoId(null), 2000);
    });
  }

  if (modo === "form") {
    return (
      <ProdutoForm
        empresa={empresa}
        produtoExistente={editando}
        onVoltar={() => { setModo("lista"); setEditando(null); }}
        onSalvo={() => { setModo("lista"); setEditando(null); carregar(); }}
      />
    );
  }

  return (
    <div className="mx-auto max-w-5xl">
      <div className="flex flex-wrap items-center justify-between gap-4">
        <div>
          <h1 className="font-display text-2xl font-semibold">{t("ps_titulo", pais)}</h1>
          <p className="text-slate-500 mt-1 text-sm">{t("ps_subtitulo", pais)}</p>
        </div>
        <div className="flex flex-wrap gap-2">
          {empresa?.slug_loja && (
            <Button variant="outline" onClick={() => {
              const url = window.location.origin + window.location.pathname + "#loja/" + empresa.slug_loja;
              navigator.clipboard.writeText(url);
              toast.success(t("dash_link_copiado", pais));
            }}><Icon.Link className="h-4 w-4" />{t("ps_copiar_link_loja", pais)}</Button>
          )}
          <Button onClick={() => setModo("form")}><Icon.Plus className="h-4 w-4" />{t("ps_novo", pais)}</Button>
        </div>
      </div>

      <SeletorTemaLoja empresa={empresa} />

      {carregando ? (
        <div className="text-slate-500 mt-10 flex items-center gap-2 text-sm"><Icon.Spinner className="h-4 w-4" />{t("carregando", pais)}</div>
      ) : produtos.length === 0 ? (
        <Card className="p-8 mt-8 text-center">
          <p className="text-slate-500 text-sm">{t("ps_vazio", pais)}</p>
          <Button className="mt-4" onClick={() => setModo("form")}><Icon.Plus className="h-4 w-4" />{t("ps_cadastrar_primeiro", pais)}</Button>
        </Card>
      ) : (
        <div className="mt-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
          {produtos.map((p) => (
            <Card key={p.id} className="p-5">
              <div className="flex items-start justify-between gap-2">
                <div>
                  <p className="font-display font-semibold">{p.nome}</p>
                  <p className="text-slate-500 text-xs mt-0.5">{tiposOperacao.find((op) => op.value === p.tipo_operacao)?.label || p.tipo_operacao}</p>
                </div>
                <span className={"shrink-0 rounded-full px-2 py-0.5 text-[11px] font-medium " +
                  (p.status === "ativo" ? "bg-primary-50 text-primary-700" : "bg-slate-100 text-slate-500")}>
                  {p.status === "ativo" ? t("ps_ativo", pais) : t("ps_rascunho", pais)}
                </span>
              </div>
              {p.preco != null && (
                <p className="font-display text-lg font-semibold mt-3">{formatarMoeda(p.preco, pais)}</p>
              )}
              {p.descricao && <p className="text-slate-500 text-xs mt-1 line-clamp-2">{p.descricao}</p>}

              {p.status === "ativo" && (
                <button onClick={() => copiarLink(p)}
                  className="border-slate-200 text-slate-600 hover:bg-slate-50 mt-4 flex w-full items-center justify-center gap-1.5 rounded-lg border px-3 py-2 text-xs font-medium">
                  {linkCopiadoId === p.id ? <React.Fragment><Icon.Check className="h-3.5 w-3.5 text-primary-600" />{t("ps_copiado", pais)}</React.Fragment> :
                    <React.Fragment><Icon.Link className="h-3.5 w-3.5" />{t("ps_copiar_link", pais)}</React.Fragment>}
                </button>
              )}
              <button onClick={() => { setEditando(p); setModo("form"); }} className="text-slate-400 hover:text-slate-600 mt-2 w-full text-center text-xs">
                {t("ps_editar_campos", pais)}
              </button>
            </Card>
          ))}
        </div>
      )}
    </div>
  );
}

function ProdutoForm({ empresa, produtoExistente, onVoltar, onSalvo }) {
  const toast = useToast();
  const pais = empresa?.pais;
  const [catalogo, setCatalogo] = useState([]);
  const [campos, setCampos] = useState([]);
  const [carregandoCampos, setCarregandoCampos] = useState(true);
  const [salvando, setSalvando] = useState(false);
  const [mostrarSeletor, setMostrarSeletor] = useState(false);
  const [tipoOperacao, setTipoOperacao] = useState(produtoExistente?.tipo_operacao || "servico_nfse");
  const [servicosOmie, setServicosOmie] = useState([]);
  const [contasOmie, setContasOmie] = useState([]);
  const [carregandoServicosOmie, setCarregandoServicosOmie] = useState(true);
  const [omieCodigoServico, setOmieCodigoServico] = useState(produtoExistente?.omie_codigo_servico || "");
  const [omieNcodcc, setOmieNcodcc] = useState(produtoExistente?.omie_ncodcc || "");
  const [criandoServicoOmie, setCriandoServicoOmie] = useState(false);
  const [salvandoServicoOmie, setSalvandoServicoOmie] = useState(false);
  const [novoServicoOmie, setNovoServicoOmie] = useState({ nome: "", codigoLC116: "", codigoServicoMunicipio: "", aliqISS: "" });
  const formRef = useRef(null);
  const tiposOperacao = getTiposOperacao(pais);
  const tiposDado = getTiposDado(pais);

  useEffect(() => {
    async function carregar() {
      const { data: cat } = await sb.from("campos_catalogo").select("*").order("ordem", { ascending: true });
      setCatalogo(cat || []);

      if (produtoExistente) {
        const { data: existentes } = await sb.from("produto_campos").select("*").eq("produto_id", produtoExistente.id).order("ordem", { ascending: true });
        setCampos((existentes || []).map((c) => ({
          tempId: c.id, campo_catalogo_id: c.campo_catalogo_id, rotulo: c.rotulo, tipo_dado: c.tipo_dado, obrigatorio: c.obrigatorio,
        })));
      }
      setCarregandoCampos(false);
    }
    carregar();
  }, [produtoExistente]);

  useEffect(() => {
    async function carregarServicosOmie() {
      try {
        const { data: sessionData } = await sb.auth.getSession();
        const resp = await fetch("https://anbvaoegvvjqcfhurpet.supabase.co/functions/v1/listar-servicos-omie", {
          headers: { Authorization: "Bearer " + sessionData.session.access_token },
        });
        const data = await resp.json();
        setServicosOmie(resp.ok ? (data.servicos || []) : []);
        setContasOmie(resp.ok ? (data.contas || []) : []);
      } catch {
        setServicosOmie([]);
        setContasOmie([]);
      } finally {
        setCarregandoServicosOmie(false);
      }
    }
    carregarServicosOmie();
  }, []);

  async function criarServicoNaOmie() {
    if (!novoServicoOmie.nome.trim()) { toast.error(t("pf_servico_omie_nome_obrigatorio", pais)); return; }
    setSalvandoServicoOmie(true);
    try {
      const form = new FormData(formRef.current);
      const precoAtual = form.get("preco") ? Number(form.get("preco")) : null;
      const { data: sessionData } = await sb.auth.getSession();
      const resp = await fetch("https://anbvaoegvvjqcfhurpet.supabase.co/functions/v1/criar-servico-omie", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + sessionData.session.access_token },
        body: JSON.stringify({
          nome: novoServicoOmie.nome, preco: precoAtual,
          codigoLC116: novoServicoOmie.codigoLC116 || null,
          codigoServicoMunicipio: novoServicoOmie.codigoServicoMunicipio || null,
          aliqISS: novoServicoOmie.aliqISS || null,
        }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || t("pf_servico_omie_erro_criar", pais));
      setServicosOmie((atual) => [...atual, { nCodServ: data.nCodServ, descricao: data.descricao, codigo: data.codigo, preco: precoAtual }]);
      setOmieCodigoServico(String(data.nCodServ));
      setCriandoServicoOmie(false);
      setNovoServicoOmie({ nome: "", codigoLC116: "", codigoServicoMunicipio: "", aliqISS: "" });
      toast.success(t("pf_servico_omie_criado_sucesso", pais));
    } catch (err) {
      toast.error(err instanceof Error ? err.message : t("pf_servico_omie_erro_criar", pais));
    } finally {
      setSalvandoServicoOmie(false);
    }
  }

  const camposFiscaisObrigatorios = catalogo.filter((c) => c.obrigatorio_fiscal);
  const faltando = camposFiscaisObrigatorios.filter((c) => !campos.some((f) => f.campo_catalogo_id === c.id));
  const checklistCompleto = faltando.length === 0;

  function adicionarCampoDoCatalogo(campoCatalogo) {
    if (campos.some((f) => f.campo_catalogo_id === campoCatalogo.id)) { toast.info(t("pf_ja_adicionado", pais)); return; }
    setCampos((c) => [...c, {
      tempId: "novo-" + Date.now(),
      campo_catalogo_id: campoCatalogo.id,
      rotulo: campoCatalogo.rotulo,
      tipo_dado: campoCatalogo.tipo_dado,
      obrigatorio: true,
    }]);
    setMostrarSeletor(false);
  }

  function adicionarCampoPersonalizado() {
    setCampos((c) => [...c, {
      tempId: "novo-" + Date.now(),
      campo_catalogo_id: null,
      rotulo: "Novo campo",
      tipo_dado: "texto",
      obrigatorio: false,
    }]);
    setMostrarSeletor(false);
  }

  function removerCampo(tempId) {
    setCampos((c) => c.filter((f) => f.tempId !== tempId));
  }

  function moverCampo(index, direcao) {
    setCampos((c) => {
      const nova = [...c];
      const alvo = index + direcao;
      if (alvo < 0 || alvo >= nova.length) return c;
      [nova[index], nova[alvo]] = [nova[alvo], nova[index]];
      return nova;
    });
  }

  function atualizarCampo(tempId, patch) {
    setCampos((c) => c.map((f) => (f.tempId === tempId ? { ...f, ...patch } : f)));
  }

  async function handleSubmit(e) {
    e.preventDefault();
    if (campos.length === 0) { toast.error(t("pf_adicione_um_campo", pais)); return; }

    setSalvando(true);
    try {
      const form = new FormData(formRef.current);
      const nome = String(form.get("nome") || "");
      const servicoSelecionado = servicosOmie.find((s) => String(s.nCodServ) === omieCodigoServico);
      const contaSelecionada = contasOmie.find((c) => String(c.nCodCC) === omieNcodcc);
      const payloadProduto = {
        empresa_id: empresa.id,
        nome,
        descricao: String(form.get("descricao") || ""),
        preco: form.get("preco") ? Number(form.get("preco")) : null,
        tipo_operacao: tipoOperacao,
        status: "ativo",
        omie_codigo_servico: omieCodigoServico || null,
        omie_descricao_servico: servicoSelecionado?.descricao || null,
        omie_ncodcc: omieNcodcc || null,
        omie_descricao_conta: contaSelecionada?.descricao || null,
        ncm: tipoOperacao.startsWith("produto_") ? (String(form.get("ncm") || "") || null) : null,
        cfop: tipoOperacao.startsWith("produto_") ? (String(form.get("cfop") || "") || null) : null,
        unidade: tipoOperacao.startsWith("produto_") ? (String(form.get("unidade") || "UN") || null) : null,
      };

      let produtoId = produtoExistente?.id;

      if (produtoExistente) {
        const { error } = await sb.from("produtos_servicos").update(payloadProduto).eq("id", produtoExistente.id);
        if (error) throw error;
        await sb.from("produto_campos").delete().eq("produto_id", produtoExistente.id);
      } else {
        let slug = slugify(nome) + "-" + Math.random().toString(36).slice(2, 6);
        const { data: inserido, error } = await sb.from("produtos_servicos").insert({ ...payloadProduto, slug_checkout: slug }).select().single();
        if (error) throw error;
        produtoId = inserido.id;
      }

      const linhasCampos = campos.map((f, i) => ({
        produto_id: produtoId,
        campo_catalogo_id: f.campo_catalogo_id,
        rotulo: f.rotulo,
        tipo_dado: f.tipo_dado,
        obrigatorio: f.obrigatorio,
        ordem: i,
      }));
      const { error: errCampos } = await sb.from("produto_campos").insert(linhasCampos);
      if (errCampos) throw errCampos;

      toast.success(t("pf_salvo", pais));
      onSalvo();
    } catch (err) {
      toast.error(err instanceof Error ? err.message : t("pf_erro_salvar", pais));
    } finally {
      setSalvando(false);
    }
  }

  return (
    <div className="mx-auto max-w-2xl">
      <button onClick={onVoltar} className="text-slate-500 hover:text-slate-700 flex items-center gap-1.5 text-xs font-medium mb-4">
        <Icon.ArrowLeft className="h-3.5 w-3.5" />{t("voltar", pais)}
      </button>
      <h1 className="font-display text-2xl font-semibold">{produtoExistente ? t("pf_editar", pais) : t("pf_novo", pais)} {t("pf_produto_servico", pais)}</h1>
      <p className="text-slate-500 mt-1 text-sm mb-6">{t("pf_defina", pais)}</p>

      <form ref={formRef} onSubmit={handleSubmit} className="space-y-6">
        <Card className="p-6 space-y-4">
          <div><Label htmlFor="nome">{t("pf_nome", pais)}</Label><Input id="nome" name="nome" required maxLength={120} defaultValue={produtoExistente?.nome || ""} placeholder="Locação de betoneira 400L" /></div>
          <div><Label htmlFor="descricao">{t("pf_descricao", pais)}</Label><textarea id="descricao" name="descricao" maxLength={500} defaultValue={produtoExistente?.descricao || ""}
            className="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500" rows={3} placeholder="O que está incluso, condições, etc." /></div>
          <div className="grid gap-4 sm:grid-cols-2">
            <div><Label htmlFor="preco">{t("pf_preco", pais)}</Label><Input id="preco" name="preco" type="number" step="0.01" min="0" defaultValue={produtoExistente?.preco || ""} placeholder="200.00" /></div>
            <div>
              <Label htmlFor="tipo_operacao">{t("pf_tipo_operacao", pais)}</Label>
              <select id="tipo_operacao" value={tipoOperacao} onChange={(e) => setTipoOperacao(e.target.value)}
                className="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                {tiposOperacao.map((op) => <option key={op.value} value={op.value}>{op.label}</option>)}
              </select>
            </div>
          </div>
          {tipoOperacao.startsWith("produto_") && (
            <div className="grid gap-4 sm:grid-cols-3 rounded-lg border border-slate-200 p-4">
              <div><Label htmlFor="ncm">NCM</Label><Input id="ncm" name="ncm" maxLength={8} defaultValue={produtoExistente?.ncm || ""} placeholder="61091000" /></div>
              <div><Label htmlFor="cfop">CFOP</Label><Input id="cfop" name="cfop" maxLength={4} defaultValue={produtoExistente?.cfop || ""} placeholder="5102" /></div>
              <div><Label htmlFor="unidade">Unidade</Label><Input id="unidade" name="unidade" maxLength={6} defaultValue={produtoExistente?.unidade || "UN"} placeholder="UN" /></div>
            </div>
          )}
          {(carregandoServicosOmie || servicosOmie.length > 0 || contasOmie.length > 0) && (
            <div className="space-y-4 rounded-lg border border-slate-200 p-4">
              <div>
                <Label htmlFor="omie_servico">{t("pf_servico_omie", pais)}</Label>
                {carregandoServicosOmie ? (
                  <div className="text-slate-400 flex items-center gap-1.5 text-xs"><Icon.Spinner className="h-3 w-3" />{t("carregando", pais)}</div>
                ) : !criandoServicoOmie ? (
                  <React.Fragment>
                    <select id="omie_servico" value={omieCodigoServico} onChange={(e) => setOmieCodigoServico(e.target.value)}
                      className="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                      <option value="">{t("pf_servico_omie_nenhum", pais)}</option>
                      {servicosOmie.map((s) => (
                        <option key={s.nCodServ} value={s.nCodServ}>{s.descricao} ({s.codigo})</option>
                      ))}
                    </select>
                    <button type="button" onClick={() => setCriandoServicoOmie(true)}
                      className="text-primary-600 hover:underline mt-1.5 flex items-center gap-1 text-xs font-medium">
                      <Icon.Plus className="h-3 w-3" />{t("pf_servico_omie_criar_novo", pais)}
                    </button>
                  </React.Fragment>
                ) : (
                  <div className="bg-slate-50 space-y-2.5 rounded-lg border border-slate-200 p-3">
                    <div>
                      <Label htmlFor="novo_servico_nome">{t("pf_servico_omie_novo_nome", pais)}</Label>
                      <Input id="novo_servico_nome" value={novoServicoOmie.nome}
                        onChange={(e) => setNovoServicoOmie((v) => ({ ...v, nome: e.target.value }))}
                        placeholder={t("pf_nome", pais)} />
                    </div>
                    <p className="text-slate-400 text-xs">{t("pf_servico_omie_novo_avancado_ajuda", pais)}</p>
                    <div className="grid gap-2 sm:grid-cols-3">
                      <div>
                        <Label htmlFor="novo_servico_lc116">{t("pf_servico_omie_lc116", pais)}</Label>
                        <Input id="novo_servico_lc116" value={novoServicoOmie.codigoLC116}
                          onChange={(e) => setNovoServicoOmie((v) => ({ ...v, codigoLC116: e.target.value }))} placeholder="7.09" />
                      </div>
                      <div>
                        <Label htmlFor="novo_servico_municipio">{t("pf_servico_omie_codmun", pais)}</Label>
                        <Input id="novo_servico_municipio" value={novoServicoOmie.codigoServicoMunicipio}
                          onChange={(e) => setNovoServicoOmie((v) => ({ ...v, codigoServicoMunicipio: e.target.value }))} placeholder="070901" />
                      </div>
                      <div>
                        <Label htmlFor="novo_servico_iss">{t("pf_servico_omie_iss", pais)}</Label>
                        <Input id="novo_servico_iss" type="number" step="0.01" value={novoServicoOmie.aliqISS}
                          onChange={(e) => setNovoServicoOmie((v) => ({ ...v, aliqISS: e.target.value }))} placeholder="3.39" />
                      </div>
                    </div>
                    <div className="flex gap-2 pt-1">
                      <Button type="button" onClick={criarServicoNaOmie} loading={salvandoServicoOmie}>{t("pf_servico_omie_criar_confirmar", pais)}</Button>
                      <Button type="button" variant="ghost" onClick={() => setCriandoServicoOmie(false)}>{t("cancelar", pais)}</Button>
                    </div>
                  </div>
                )}
                <p className="text-slate-400 mt-1 text-xs">{t("pf_servico_omie_ajuda", pais)}</p>
              </div>

              {contasOmie.length > 0 && (
                <div>
                  <Label htmlFor="omie_conta">{t("pf_conta_omie", pais)}</Label>
                  <select id="omie_conta" value={omieNcodcc} onChange={(e) => setOmieNcodcc(e.target.value)}
                    className="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                    <option value="">{t("pf_conta_omie_padrao", pais)}</option>
                    {contasOmie.map((c) => (
                      <option key={c.nCodCC} value={c.nCodCC}>{c.descricao}</option>
                    ))}
                  </select>
                  <p className="text-slate-400 mt-1 text-xs">{t("pf_conta_omie_ajuda", pais)}</p>
                </div>
              )}
            </div>
          )}
        </Card>

        <Card className="p-6">
          <div className="flex items-center justify-between mb-1">
            <h3 className="font-display text-lg font-semibold">{t("pf_formulario_pedido", pais)}</h3>
          </div>
          <p className="text-slate-500 text-sm mb-4">{t("pf_formulario_desc", pais)}</p>

          <div className="mb-4 rounded-lg border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-600">
            {t("pf_aviso_campos", pais)}
          </div>

          {!carregandoCampos && camposFiscaisObrigatorios.length > 0 && (
            <div className={"mb-4 rounded-lg border px-4 py-3 text-sm " + (checklistCompleto ? "border-primary-200 bg-primary-50" : "border-slate-200 bg-slate-50")}>
              <p className={"font-medium mb-2 " + (checklistCompleto ? "text-primary-700" : "text-slate-600")}>
                {checklistCompleto ? t("pf_checklist_ok", pais) : t("pf_checklist_faltam", pais)}
              </p>
              {!checklistCompleto && (
                <ul className="space-y-1">
                  {faltando.map((c) => <li key={c.id} className="text-slate-500 text-xs">• {c.rotulo}</li>)}
                </ul>
              )}
            </div>
          )}

          {carregandoCampos ? (
            <div className="text-slate-500 flex items-center gap-2 text-sm"><Icon.Spinner className="h-4 w-4" />{t("carregando", pais)}</div>
          ) : (
            <div className="space-y-2">
              {campos.map((f, i) => (
                <div key={f.tempId} className="border-slate-200 flex flex-wrap items-center gap-2 rounded-lg border px-3 py-2.5">
                  <div className="flex shrink-0 flex-col">
                    <button type="button" onClick={() => moverCampo(i, -1)} disabled={i === 0} className="text-slate-400 hover:text-slate-600 disabled:opacity-30"><Icon.ChevronUp className="h-3.5 w-3.5" /></button>
                    <button type="button" onClick={() => moverCampo(i, 1)} disabled={i === campos.length - 1} className="text-slate-400 hover:text-slate-600 disabled:opacity-30"><Icon.ChevronDown className="h-3.5 w-3.5" /></button>
                  </div>
                  <div className="min-w-[200px] flex-1 grid gap-2 sm:grid-cols-[1fr_auto]">
                    <Input value={f.rotulo} onChange={(e) => atualizarCampo(f.tempId, { rotulo: e.target.value })}
                      disabled={!!f.campo_catalogo_id} className={f.campo_catalogo_id ? "bg-slate-50 text-slate-600" : ""} />
                    <select value={f.tipo_dado} onChange={(e) => atualizarCampo(f.tempId, { tipo_dado: e.target.value })} disabled={!!f.campo_catalogo_id}
                      className="rounded-lg border border-slate-300 px-2 py-2 text-xs disabled:bg-slate-50 disabled:text-slate-500">

                    </select>
                  </div>
                  <div className="ml-auto flex shrink-0 items-center gap-3">
                    <label className="flex items-center gap-1.5 text-xs text-slate-500 shrink-0">
                      <input type="checkbox" checked={f.obrigatorio} onChange={(e) => atualizarCampo(f.tempId, { obrigatorio: e.target.checked })} />

                    <button type="button" onClick={() => removerCampo(f.tempId)} className="text-slate-400 hover:text-red-600 shrink-0"><Icon.Trash className="h-4 w-4" /></button>

                </div>
              ))}

              {campos.length === 0 && <p className="text-slate-400 text-sm">{t("pf_nenhum_campo", pais)}</p>}

              {mostrarSeletor ? (
                <div className="border-slate-200 mt-2 rounded-lg border p-3">
                  <p className="text-xs font-medium text-slate-600 mb-2">{t("pf_escolher_catalogo", pais)}</p>
                  <div className="flex flex-wrap gap-1.5 mb-3">
                    {catalogo.filter((c) => !campos.some((f) => f.campo_catalogo_id === c.id)).map((c) => (
                      <button key={c.id} type="button" onClick={() => adicionarCampoDoCatalogo(c)}
                        className="border-slate-200 hover:border-primary-300 hover:bg-primary-50 rounded-full border px-3 py-1 text-xs">
                        {c.rotulo}{c.obrigatorio_fiscal ? " *" : ""}
                      </button>
                    ))}
                  </div>
                  <div className="flex gap-2">
                    <Button type="button" variant="ghost" onClick={adicionarCampoPersonalizado}>{t("pf_criar_personalizado", pais)}</Button>
                    <Button type="button" variant="ghost" onClick={() => setMostrarSeletor(false)}>{t("cancelar", pais)}</Button>
                  </div>
                </div>
              ) : (
                <button type="button" onClick={() => setMostrarSeletor(true)}
                  className="border-slate-300 text-slate-600 hover:border-primary-300 hover:text-primary-700 mt-2 flex w-full items-center justify-center gap-1.5 rounded-lg border border-dashed px-3 py-2.5 text-sm">
                  <Icon.Plus className="h-4 w-4" />{t("pf_adicionar_campo", pais)}
                </button>
              )}
            </div>
          )}
        </Card>

        <Button type="submit" className="w-full" loading={salvando}>
          {t("pf_salvar_ativar", pais)}
        </Button>
      </form>
    </div>
  );
}

const SISTEMAS_EXTERNOS = [
  { slug: "obra_organize", nome: "Obra Organize" },
];

function IntegracoesPage({ empresa }) {
  const toast = useToast();
  const pais = empresa?.pais;
  const [carregando, setCarregando] = useState(true);
  const [integracoes, setIntegracoes] = useState([]);
  const [chaveInput, setChaveInput] = useState("");
  const [salvando, setSalvando] = useState(false);
  const [mostrarSeletorCampo, setMostrarSeletorCampo] = useState(null);

  const carregar = useCallback(async () => {
    if (!empresa?.id) { setCarregando(false); return; }
    setCarregando(true);
    const { data } = await sb.from("integracoes_externas").select("*").eq("empresa_id", empresa.id);
    setIntegracoes(data || []);
    setCarregando(false);
  }, [empresa]);

  useEffect(() => { carregar(); }, [carregar]);

  async function conectar(sistemaSlug) {
    if (!chaveInput.trim()) { toast.error(t("ig_cole_chave_erro", pais)); return; }
    setSalvando(true);
    const buffer = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(chaveInput.trim()));
    const hash = Array.from(new Uint8Array(buffer)).map((b) => b.toString(16).padStart(2, "0")).join("");
    const { error } = await sb.from("integracoes_externas").insert({
      empresa_id: empresa.id, sistema_origem: sistemaSlug, chave_hash: hash, status: "ativa",
    });
    setSalvando(false);
    if (error) { toast.error(error.message); return; }
    toast.success(t("ig_conectado_sucesso", pais));
    setChaveInput("");
    carregar();
  }

  async function desconectar(id) {
    await sb.from("integracoes_externas").delete().eq("id", id);
    toast.success(t("ig_desconectado", pais));
    carregar();
  }

  async function atualizarCampos(integracao, novosCampos) {
    await sb.from("integracoes_externas").update({ campos_adicionais: novosCampos }).eq("id", integracao.id);
    carregar();
  }

  function adicionarCampo(integracao, campoCatalogo) {
    const atuais = Array.isArray(integracao.campos_adicionais) ? integracao.campos_adicionais : [];
    if (atuais.some((c) => c.chave === campoCatalogo.chave)) { setMostrarSeletorCampo(null); return; }
    atualizarCampos(integracao, [...atuais, { chave: campoCatalogo.chave, rotulo: campoCatalogo.rotulo, tipo_dado: campoCatalogo.tipo_dado, obrigatorio: true }]);
    setMostrarSeletorCampo(null);
  }

  function removerCampo(integracao, chave) {
    const atuais = Array.isArray(integracao.campos_adicionais) ? integracao.campos_adicionais : [];
    atualizarCampos(integracao, atuais.filter((c) => c.chave !== chave));
  }

  const CATALOGO_CAMPOS_FIXO = {
    BR: [
      { chave: "cpf_cnpj", rotulo: "CPF/CNPJ", tipo_dado: "cpf_cnpj" },
      { chave: "email", rotulo: "E-mail", tipo_dado: "email" },
      { chave: "telefone", rotulo: "Telefone", tipo_dado: "telefone" },
      { chave: "data_nascimento", rotulo: "Data de nascimento", tipo_dado: "data" },
    ],
    ES: [
      { chave: "cpf_cnpj", rotulo: "NIF/NIE", tipo_dado: "cpf_cnpj" },
      { chave: "email", rotulo: "Correo electrónico", tipo_dado: "email" },
      { chave: "telefone", rotulo: "Teléfono", tipo_dado: "telefone" },
      { chave: "data_nascimento", rotulo: "Fecha de nacimiento", tipo_dado: "data" },
    ],
    US: [
      { chave: "cpf_cnpj", rotulo: "EIN/SSN", tipo_dado: "cpf_cnpj" },
      { chave: "email", rotulo: "Email", tipo_dado: "email" },
      { chave: "telefone", rotulo: "Phone", tipo_dado: "telefone" },
      { chave: "data_nascimento", rotulo: "Date of birth", tipo_dado: "data" },
    ],
  }[pais] || [];

  return (
    <div className="mx-auto max-w-2xl">
      <h1 className="font-display text-2xl font-semibold">{t("ig_titulo", pais)}</h1>
      <p className="text-slate-500 mt-1 text-sm">{t("ig_subtitulo", pais)}</p>

      {carregando ? (
        <div className="text-slate-500 mt-10 flex items-center gap-2 text-sm"><Icon.Spinner className="h-4 w-4" />{t("carregando", pais)}</div>
      ) : (
        <div className="mt-6 space-y-4">
          {SISTEMAS_EXTERNOS.map((sistema) => {
            const integracao = integracoes.find((i) => i.sistema_origem === sistema.slug);
            return (
              <Card key={sistema.slug} className="p-6">
                <div className="flex items-center justify-between gap-4 mb-1">
                  <h3 className="font-display text-lg font-semibold">{sistema.nome}</h3>
                  {integracao && <span className="bg-primary-50 text-primary-700 border border-primary-200 rounded-full px-2.5 py-0.5 text-xs font-medium">{t("ig_conectado", pais)}</span>}
                </div>

                {!integracao ? (
                  <React.Fragment>
                    <p className="text-slate-500 text-sm mb-4">{t("ig_cole_chave", pais)} {sistema.nome}.</p>
                    <div className="flex flex-col sm:flex-row gap-2">
                      <Input value={chaveInput} onChange={(e) => setChaveInput(e.target.value)} type="password" name="integracao_chave_api" autoComplete="new-password" data-lpignore="true" data-1p-ignore placeholder="••••••••" className="flex-1" />
                      <Button onClick={() => conectar(sistema.slug)} loading={salvando}>{t("ig_conectar", pais)}</Button>
                    </div>
                  </React.Fragment>
                ) : (
                  <React.Fragment>
                    <p className="text-slate-500 text-sm mb-4">
                      {t("ig_conectado_desc1", pais)} {sistema.nome} {t("ig_conectado_desc2", pais)}
                    </p>

                    <div className="border-t border-slate-100 pt-4">
                      <p className="text-sm font-medium mb-1">{t("ig_campos_extras", pais)}</p>
                      <p className="text-slate-500 text-xs mb-3">{t("ig_campos_extras_desc", pais)}</p>

                      <div className="space-y-1.5 mb-2">
                        {(integracao.campos_adicionais || []).map((c) => (
                          <div key={c.chave} className="flex items-center justify-between rounded-lg border border-slate-200 px-3 py-2 text-sm">
                            <span>{c.rotulo}</span>
                            <button onClick={() => removerCampo(integracao, c.chave)} className="text-slate-400 hover:text-red-600"><Icon.Trash className="h-3.5 w-3.5" /></button>
                          </div>
                        ))}
                        {(integracao.campos_adicionais || []).length === 0 && <p className="text-slate-400 text-xs">{t("ig_nenhum_campo_extra", pais)}</p>}
                      </div>

                      {mostrarSeletorCampo === integracao.id ? (
                        <div className="flex flex-wrap gap-1.5">
                          {CATALOGO_CAMPOS_FIXO.filter((c) => !(integracao.campos_adicionais || []).some((a) => a.chave === c.chave)).map((c) => (
                            <button key={c.chave} onClick={() => adicionarCampo(integracao, c)}
                              className="border-slate-200 hover:border-primary-300 hover:bg-primary-50 rounded-full border px-3 py-1 text-xs">{c.rotulo}</button>
                          ))}
                          <button onClick={() => setMostrarSeletorCampo(null)} className="text-slate-400 text-xs px-2">{t("cancelar", pais)}</button>
                        </div>
                      ) : (
                        <button onClick={() => setMostrarSeletorCampo(integracao.id)} className="text-primary-600 text-xs font-medium">{t("ig_adicionar_campo", pais)}</button>
                      )}
                    </div>

                    <Button variant="ghost" className="mt-4" onClick={() => desconectar(integracao.id)}><Icon.Unplug className="h-4 w-4" />{t("ig_desconectar", pais)}</Button>
                  </React.Fragment>
                )}
              </Card>
            );
          })}
        </div>
      )}

      <CardContratarConfiguracao pais={pais} className="mt-6" />
    </div>
  );
}

function ModoEmissaoConfig({ empresa }) {
  const toast = useToast();
  const pais = empresa.pais;
  const [modo, setModo] = useState(empresa.modo_emissao || "automatico");
  const [agendamentoTipo, setAgendamentoTipo] = useState(empresa.agendamento_tipo || "nenhum");
  const [agendamentoData, setAgendamentoData] = useState(empresa.agendamento_data || "");
  const [agendamentoDiaMes, setAgendamentoDiaMes] = useState(empresa.agendamento_dia_mes || 1);
  const [salvando, setSalvando] = useState(false);

  async function salvar() {
    setSalvando(true);
    const payload = {
      modo_emissao: modo,
      agendamento_tipo: modo === "manual" ? agendamentoTipo : "nenhum",
      agendamento_data: modo === "manual" && agendamentoTipo === "data_especifica" ? agendamentoData || null : null,
      agendamento_dia_mes: modo === "manual" && agendamentoTipo === "mensal" ? Number(agendamentoDiaMes) : null,
    };
    const { error } = await sb.from("empresas").update(payload).eq("id", empresa.id);
    setSalvando(false);
    if (error) { toast.error(error.message); return; }
    toast.success(t("me_atualizado", pais));
    Object.assign(empresa, payload);
  }

  return (
    <Card className="p-6 mt-4">
      <h3 className="font-display text-lg font-semibold mb-1">{t("me_titulo", pais)}</h3>
      <p className="text-slate-500 text-sm mb-4">{t("me_subtitulo", pais)}</p>

      <div className="grid gap-3 sm:grid-cols-2">
        <button type="button" onClick={() => setModo("automatico")}
          className={"rounded-lg border p-4 text-left " + (modo === "automatico" ? "border-primary-500 bg-primary-50" : "border-slate-200")}>
          <p className="font-medium text-sm">{t("me_automatico", pais)}</p>
          <p className="text-slate-500 text-xs mt-1">{t("me_automatico_desc", pais)}</p>
        </button>
        <button type="button" onClick={() => setModo("manual")}
          className={"rounded-lg border p-4 text-left " + (modo === "manual" ? "border-primary-500 bg-primary-50" : "border-slate-200")}>
          <p className="font-medium text-sm">{t("me_manual", pais)}</p>
          <p className="text-slate-500 text-xs mt-1">{t("me_manual_desc", pais)}</p>
        </button>
      </div>

      {modo === "manual" && (
        <div className="mt-4 border-t border-slate-100 pt-4">
          <Label>{t("me_agendamento", pais)}</Label>
          <div className="grid gap-2 sm:grid-cols-3 mb-3">
            <button type="button" onClick={() => setAgendamentoTipo("nenhum")}
              className={"rounded-lg border px-3 py-2 text-xs font-medium " + (agendamentoTipo === "nenhum" ? "border-primary-500 bg-primary-50 text-primary-700" : "border-slate-300 text-slate-600")}>
              {t("me_sem_agenda", pais)}
            </button>
            <button type="button" onClick={() => setAgendamentoTipo("data_especifica")}
              className={"rounded-lg border px-3 py-2 text-xs font-medium " + (agendamentoTipo === "data_especifica" ? "border-primary-500 bg-primary-50 text-primary-700" : "border-slate-300 text-slate-600")}>
              {t("me_data_especifica", pais)}
            </button>
            <button type="button" onClick={() => setAgendamentoTipo("mensal")}
              className={"rounded-lg border px-3 py-2 text-xs font-medium " + (agendamentoTipo === "mensal" ? "border-primary-500 bg-primary-50 text-primary-700" : "border-slate-300 text-slate-600")}>
              {t("me_mensal", pais)}
            </button>
          </div>

          {agendamentoTipo === "data_especifica" && (
            <Input type="date" value={agendamentoData} onChange={(e) => setAgendamentoData(e.target.value)} className="max-w-xs" />
          )}
          {agendamentoTipo === "mensal" && (
            <div className="flex items-center gap-2">
              <span className="text-sm text-slate-600">{t("me_todo_dia", pais)}</span>
              <select value={agendamentoDiaMes} onChange={(e) => setAgendamentoDiaMes(e.target.value)}
                className="rounded-lg border border-slate-300 px-2 py-2 text-sm">
                {Array.from({ length: 31 }, (_, i) => i + 1).map((d) => <option key={d} value={d}>{d}</option>)}
              </select>
              <span className="text-sm text-slate-600">{t("me_do_mes", pais)}</span>
            </div>
          )}
          <p className="text-slate-400 text-xs mt-2">{t("me_agendamento_desc", pais)}</p>
        </div>
      )}

      <Button className="mt-4" onClick={salvar} loading={salvando}>{t("me_salvar", pais)}</Button>
    </Card>
  );
}

function AtivarAutomacaoPage({ empresa, setScreen }) {
  const toast = useToast();
  const pais = empresa?.pais;
  const [carregando, setCarregando] = useState(true);
  const [provedores, setProvedores] = useState([]);
  const [conexao, setConexao] = useState(null);
  const [categoria, setCategoria] = useState(null); // 'api_propria' | 'emissor_embutido' | null
  const [provedorSelecionado, setProvedorSelecionado] = useState(null);
  const [valores, setValores] = useState({});
  const [salvando, setSalvando] = useState(false);
  const [desconectando, setDesconectando] = useState(false);

  const carregar = useCallback(async () => {
    if (!empresa?.id) { setCarregando(false); return; }
    setCarregando(true);
    const { data: provs } = await sb.from("provedores_fiscais").select("*").eq("ativo", true).eq("pais", empresa.pais || "BR").order("ordem", { ascending: true });
    setProvedores(provs || []);
    const { data: con } = await sb.from("empresa_conexao_fiscal").select("*, provedores_fiscais(nome, slug)").eq("empresa_id", empresa.id).eq("status_conexao", "ativa").maybeSingle();
    setConexao(con || null);
    setCarregando(false);
  }, [empresa]);

  useEffect(() => { carregar(); }, [carregar]);

  function parseCampos(v) {
    if (!Array.isArray(v)) return [];
    return v.filter((c) => c && typeof c === "object" && "chave" in c && "rotulo" in c);
  }

  const provedorAtual = provedores.find((p) => p.id === provedorSelecionado) || null;
  const campos = parseCampos(provedorAtual?.campos_necessarios);
  const provedoresDaCategoria = provedores.filter((p) => p.tipo_conexao === categoria);

  async function salvarConexao(e) {
    e.preventDefault();
    const faltando = campos.filter((c) => !valores[c.chave]?.trim());
    if (faltando.length > 0) { toast.error(t("aa_preencha_campos", pais)); return; }
    setSalvando(true);
    try {
      const { data: sessionData } = await sb.auth.getSession();
      const resp = await fetch("https://anbvaoegvvjqcfhurpet.supabase.co/functions/v1/salvar-conexao-fiscal", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + sessionData.session.access_token },
        body: JSON.stringify({ provedor_id: provedorAtual.id, valores }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || t("pf_erro_salvar", pais));
      toast.success(t("aa_conectado_sucesso", pais));
      setProvedorSelecionado(null);
      setValores({});
      carregar();
    } catch (err) {
      toast.error(err instanceof Error ? err.message : t("pf_erro_salvar", pais));
    } finally {
      setSalvando(false);
    }
  }

  async function desconectar() {
    setDesconectando(true);
    try {
      const { data: sessionData } = await sb.auth.getSession();
      const resp = await fetch("https://anbvaoegvvjqcfhurpet.supabase.co/functions/v1/desconectar-fiscal", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + sessionData.session.access_token },
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || t("pf_erro_salvar", pais));
      toast.success(t("aa_desconectado", pais));
      carregar();
    } catch (err) {
      toast.error(err instanceof Error ? err.message : t("pf_erro_salvar", pais));
    } finally {
      setDesconectando(false);
    }
  }

  return (
    <div className="mx-auto max-w-3xl">
      <h1 className="font-display text-2xl font-semibold">{t("aa_titulo", pais)}</h1>
      <p className="text-slate-500 mt-1 text-sm">{t("aa_subtitulo", pais)}</p>

      {carregando ? (
        <div className="text-slate-500 mt-10 flex items-center gap-2 text-sm"><Icon.Spinner className="h-4 w-4" />{t("carregando", pais)}</div>
      ) : !empresa ? (
        <Card className="p-6 mt-8">
          <h3 className="font-display text-lg font-semibold">{t("aa_cadastre_primeiro", pais)}</h3>
          <p className="text-slate-500 text-sm mb-4">{t("aa_cadastre_primeiro_desc", pais)}</p>
          <Button onClick={() => setScreen("cadastro-empresa")}>{t("dash_cadastrar_empresa", pais)}</Button>
        </Card>
      ) : provedores.length === 0 && !conexao ? (
        <Card className="p-6 mt-8">
          <h3 className="font-display text-lg font-semibold">{t("aa_preparando", pais)}</h3>
          <p className="text-slate-500 text-sm">{t("aa_preparando_desc", pais)}</p>
        </Card>
      ) : conexao ? (
        <React.Fragment>
        <Card className="p-6 mt-8">
          <div className="flex items-start justify-between gap-4 mb-4">
            <div>
              <h3 className="font-display flex items-center gap-2 text-lg font-semibold"><Icon.Check className="text-primary-600 h-5 w-5" />{t("aa_conectado_com", pais)} {conexao.provedores_fiscais?.nome || "provedor"}</h3>
              <p className="text-slate-500 text-sm mt-1">{empresa.modo_emissao === "manual" ? t("aa_modo_manual_desc", pais) : t("aa_modo_auto_desc", pais)}</p>
            </div>
            <span className="bg-primary-50 text-primary-700 border border-primary-200 rounded-full px-2.5 py-0.5 text-xs font-medium shrink-0">{t("aa_ativa", pais)}</span>
          </div>
          <div className="flex flex-wrap gap-2">

function ReceberOnlinePage({ empresa }) {
  const toast = useToast();
  const pais = empresa?.pais;
  const [carregando, setCarregando] = useState(true);
  const [conexao, setConexao] = useState(null);
  const [editando, setEditando] = useState(false);
  const [secretKey, setSecretKey] = useState("");
  const [publishableKey, setPublishableKey] = useState("");
  const [webhookSecret, setWebhookSecret] = useState("");
  const [salvando, setSalvando] = useState(false);

  const webhookUrl = "https://anbvaoegvvjqcfhurpet.supabase.co/functions/v1/stripe-webhook";

  const carregar = useCallback(async () => {
    if (!empresa?.id) { setCarregando(false); return; }
    setCarregando(true);
    const { data } = await sb.from("empresa_conexao_pagamento").select("*").eq("empresa_id", empresa.id).maybeSingle();
    setConexao(data || null);
    setCarregando(false);
  }, [empresa]);

  useEffect(() => { carregar(); }, [carregar]);

  async function salvar(e) {
    e.preventDefault();
    if (!secretKey.trim() || !publishableKey.trim() || !webhookSecret.trim()) { toast.error(t("ro_preencha_tres", pais)); return; }
    setSalvando(true);
    try {
      const { data: sessionData } = await sb.auth.getSession();
      const resp = await fetch("https://anbvaoegvvjqcfhurpet.supabase.co/functions/v1/salvar-conexao-pagamento", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + sessionData.session.access_token },
        body: JSON.stringify({
          publishable_key: publishableKey.trim(),
          secret_key: secretKey.trim(),
          webhook_secret: webhookSecret.trim(),
          conexao_id: conexao?.id || null,
        }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || t("pf_erro_salvar", pais));
      toast.success(t("ro_conectado_sucesso", pais));
      setEditando(false);
      setSecretKey(""); setPublishableKey(""); setWebhookSecret("");
      carregar();
    } catch (err) {
      toast.error(err instanceof Error ? err.message : t("pf_erro_salvar", pais));
    } finally {
      setSalvando(false);
    }
  }

    if (!conexao) return;
    const { error } = await sb.from("empresa_conexao_pagamento").delete().eq("id", conexao.id);

      { passo: 5, titulo: "Selecciona el evento correcto", descricao: "En la lista de eventos a escuchar, marca \"checkout.session.completed\" y guarda.", link: null },
      { passo: 6, titulo: "Copia el Signing secret del webhook", descricao: "Después de crearlo, haz clic en el endpoint y copia el \"Signing secret\" (empieza con whsec_).", link: null },
      { passo: 7, titulo: "Pega las tres claves abajo", descricao: "Completa los tres campos y guarda.", link: null },
    ],
    US: [

  return (

/* ============================================================
   CÓDIGO DE RECEBIMENTO (confirmação de pagamento em dinheiro)
============================================================ */
function CodigoRecebimentoPage({ empresa }) {
  const toast = useToast();
  const pais = empresa?.pais;
  const [codigo, setCodigo] = useState("");
  const [confirmando, setConfirmando] = useState(false);
  const [pendentes, setPendentes] = useState([]);
  const [carregandoLista, setCarregandoLista] = useState(true);

  const carregarPendentes = useCallback(async () => {
    if (!empresa?.id) { setCarregandoLista(false); return; }
    setCarregandoLista(true);
    const { data } = await sb.from("pedidos").select("id, cliente_nome, codigo_recebimento, criado_em, nome_item, valor, produtos_servicos(nome, preco)")
      .eq("empresa_id", empresa.id).in("forma_pagamento", ["dinheiro", "cartao_presencial"]).eq("pagamento_confirmado", false).order("criado_em", { ascending: false });
    setPendentes(data || []);
    setCarregandoLista(false);
  }, [empresa]);

  useEffect(() => { carregarPendentes(); }, [carregarPendentes]);

  async function confirmar(e) {
    e.preventDefault();
    if (!codigo.trim()) return;
    setConfirmando(true);
    try {
      const { data: sessionData } = await sb.auth.getSession();
      const resp = await fetch("https://anbvaoegvvjqcfhurpet.supabase.co/functions/v1/confirmar-pagamento-dinheiro", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + sessionData.session.access_token,
        },
        body: JSON.stringify({ codigo: codigo.trim() }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || t("cr_codigo_nao_encontrado", pais));
      toast.success(t("cr_confirmado_sucesso", pais));
      setCodigo("");
      carregarPendentes();
    } catch (err) {
      toast.error(err instanceof Error ? err.message : t("cr_codigo_nao_encontrado", pais));
    } finally {
      setConfirmando(false);
    }
  }

  return (
    <div className="mx-auto max-w-2xl">
      <h1 className="font-display text-2xl font-semibold">{t("cr_titulo", pais)}</h1>
      <p className="text-slate-500 mt-1 text-sm">{t("cr_subtitulo", pais)}</p>

      <Card className="p-5 mt-6 bg-slate-50 border-slate-200">
        <p className="text-sm font-medium text-slate-700 mb-1">{t("cr_link_colaborador", pais)}</p>
        <p className="text-slate-500 text-xs mb-3">{t("cr_link_colaborador_desc", pais)}</p>
        <div className="flex flex-wrap gap-2">
          <Button variant="outline" onClick={() => {
            const url = window.location.origin + window.location.pathname + "#recebimento/" + empresa.token_recebimento;
            navigator.clipboard.writeText(url);
            toast.success(t("cr_link_copiado", pais));
          }}><Icon.Link className="h-4 w-4" />{t("cr_copiar_link", pais)}</Button>
          <Button variant="ghost" onClick={async () => {
            const { error } = await sb.from("empresas").update({ token_recebimento: crypto.randomUUID() }).eq("id", empresa.id);
            if (error) { toast.error(error.message); return; }
            toast.success(t("cr_novo_gerado", pais));
            window.location.reload();
          }}>{t("cr_gerar_novo", pais)}</Button>
        </div>
      </Card>

      <Card className="p-6 mt-4">
        <form onSubmit={confirmar} className="flex flex-col sm:flex-row gap-3">
          <Input value={codigo} onChange={(e) => setCodigo(e.target.value)} placeholder="Ex: A1B2C3" className="flex-1 uppercase" maxLength={12} />
          <Button type="submit" loading={confirmando}>{t("cr_confirmar", pais)}</Button>
        </form>
      </Card>

      <div className="mt-8">
        <h3 className="font-display text-lg font-semibold mb-3">{t("cr_aguardando", pais)}</h3>
        {carregandoLista ? (
          <div className="text-slate-500 flex items-center gap-2 text-sm"><Icon.Spinner className="h-4 w-4" />{t("carregando", pais)}</div>
        ) : pendentes.length === 0 ? (
          <p className="text-slate-500 text-sm">{t("cr_nenhum_pendente", pais)}</p>
        ) : (
          <div className="space-y-2">
            {pendentes.map((p) => {
              const nome = p.produtos_servicos?.nome || p.nome_item || "";
              const preco = p.produtos_servicos?.preco ?? p.valor;
              return (
                <Card key={p.id} className="p-4 flex items-center justify-between gap-3">
                  <div>
                    <p className="text-sm font-medium">{nome}{p.cliente_nome ? " · " + p.cliente_nome : ""}</p>
                    <p className="text-slate-400 text-xs">{t("pd_codigo", pais)}: {p.codigo_recebimento || "—"}</p>
                  </div>
                  {preco != null && (
                    <p className="font-display text-sm font-semibold shrink-0">{formatarMoeda(preco, pais)}</p>
                  )}
                </Card>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}
